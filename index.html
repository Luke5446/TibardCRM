<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F3864">
<title>Tibard Sales Pipeline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F3864'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23C9A24B'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root{
  --navy:#1F3864; --navy2:#2a4a80; --steel:#5b7ba6; --gold:#C9A24B;
  --bg:#f4f6f9; --card:#ffffff; --line:#dfe4ec; --txt:#1c2431; --mut:#6b7686;
  --red:#c0392b; --green:#1e7e46; --amber:#92400e;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--navy2)}

/* ---- header (matches Costing Calculator) ---- */
header{background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
header img{height:34px;background:#fff;border-radius:6px;padding:3px 8px}
header h1{font-size:17px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
header h1 span{color:var(--gold)}
header .spacer{flex:1}
@media(max-width:700px){header{gap:8px;padding-left:12px;padding-right:12px}header img{height:28px;padding:2px 6px}header h1{font-size:15px}.sync span{display:none}#refreshBtn{display:none}.userchip{padding:5px 8px;font-size:11.5px}.ibtn{flex-shrink:0}}
@media(max-width:480px){header h1{display:none}}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;opacity:.85;white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:#9aa6b8;display:inline-block}
.sync i.ok{background:#3ddc84}.sync i.busy{background:var(--gold);animation:pulse 1s infinite}.sync i.err{background:#ff6b5b}.sync i.local{background:#9aa6b8}
@keyframes pulse{50%{opacity:.3}}
.ibtn{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn.gold{background:var(--gold);color:#22262e}
.userchip{font-size:12px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:14px;white-space:nowrap}
.userchip b{color:var(--gold)}

/* ---- tabs ---- */
nav.tabs{background:var(--navy);display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(54px + var(--sat));z-index:49}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
nav.tabs button.on{background:var(--gold);color:#22262e}
nav.tabs button .lock{font-size:11px;opacity:.8}
nav.tabs button .cnt{font-size:11px;background:rgba(0,0,0,.18);border-radius:10px;padding:1px 7px}

main{max-width:1180px;margin:0 auto;padding:14px 14px calc(80px + var(--sab))}
.banner{background:#fffbea;border:1px solid #f1e3a4;color:#7A5B14;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:#fee2e2;border-color:#f3b4b4;color:#991b1b}
.banner .lnk{font-weight:700;cursor:pointer;text-decoration:underline}

/* ---- buttons / fields ---- */
.btn{border:none;border-radius:6px;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600;background:#e8ecf3;color:var(--navy);white-space:nowrap}
.btn:hover{background:#dde3ee}
.btn-gold{background:var(--gold);color:#22262e}.btn-gold:hover{background:#d5b25f}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy2)}
.btn-red{background:#fee2e2;color:#991b1b}
.btn-sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:10px 11px;font-size:15px;outline:none;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--steel)}
.field textarea{min-height:80px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.grid .span2{grid-column:span 2}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.grid .span2,.grid .mspan{grid-column:span 2}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--mut)}
.chips .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips .chip.gold.on{background:var(--gold);border-color:var(--gold);color:#22262e}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(20,30,50,.06);overflow:hidden;margin-bottom:12px}
.card h2{font-size:14px;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--navy);display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-size:12px;font-weight:400;color:var(--mut)}
.card .body{padding:12px 14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;outline:none;background:#fff}
.toolbar input[type=search]:focus{border-color:var(--steel)}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;font-size:13px}

/* opportunity list */
.olist{display:flex;flex-direction:column;gap:8px}
.opp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,50,.05);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.opp:hover{border-color:var(--steel)}
.opp .co{font-weight:700;font-size:15px;color:var(--navy)}
.opp .meta{font-size:12px;color:var(--mut);grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.opp .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.opp .val small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.opp .next{grid-column:1/-1;font-size:12.5px;margin-top:2px;display:flex;gap:6px;align-items:baseline}
.opp .next .due{font-weight:700;white-space:nowrap}
.due.over{color:var(--red)}.due.soon{color:var(--amber)}.due.ok{color:var(--green)}
.stg{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.2px;white-space:nowrap;background:#e8ecf3;color:var(--navy)}
.stg[data-s="Lead"]{background:#eef1f6;color:#6b7686}
.stg[data-s="Contacted"]{background:#e6edf7;color:#2a4a80}
.stg[data-s="Quoted"]{background:#fbf3dc;color:#7A5B14}
.stg[data-s="Samples"]{background:#ece6f7;color:#5b3f9e}
.stg[data-s="Account set-up"]{background:#dff3f3;color:#0e6b73}
.stg[data-s="Won"]{background:#d1fae5;color:#065f46}
.stg[data-s="On hold"]{background:#fef3c7;color:#92400e}
.stg[data-s="Lost"]{background:#fee2e2;color:#991b1b}

/* board */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 230px;background:#eef1f6;border-radius:10px;padding:8px}
.col h3{font-size:12px;color:var(--navy);display:flex;justify-content:space-between;padding:4px 4px 8px}
.col h3 small{color:var(--mut);font-weight:400}
.col .opp{padding:9px 10px;margin-bottom:8px}
.col .opp .co{font-size:13.5px}.col .opp .next{flex-direction:column;gap:2px}

/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.1}
.kpi .s{font-size:11px;color:var(--mut);margin-top:3px}
.kpi.warn .v{color:var(--red)}.kpi.good .v{color:var(--green)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:12px}
.bar .t{height:16px;background:#eef1f6;border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--steel);border-radius:4px}
.bar .n{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.rep2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.rep2{grid-template-columns:1fr}}
.att{list-style:none}
.att li{padding:8px 0;border-bottom:1px solid #eef1f6;font-size:13px;display:flex;gap:8px;align-items:baseline;cursor:pointer}
.att li:last-child{border-bottom:none}
.att li .who{font-size:11px;color:var(--mut);white-space:nowrap;margin-left:auto}

/* sheet / modal */
.ov{position:fixed;inset:0;height:100svh;background:rgba(15,25,45,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center;padding:20px}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:calc(100svh - 20px);border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:700px){.sheet{border-radius:14px;max-height:90vh}}
.sheet .sh{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.sheet .sh h2{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sheet .sh .mx{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;opacity:.8;line-height:1}
.sheet .sb{overflow-y:auto;padding:12px 14px calc(16px + var(--sab));-webkit-overflow-scrolling:touch}
.sheet .sf{background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--sab));display:flex;gap:8px;flex-wrap:wrap}
.sheet .sf .btn{flex:1}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:9px 12px;border-bottom:1px solid #eef1f6;display:flex;align-items:center}
.sec h3 .r{margin-left:auto}
.sec .b{padding:10px 12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px;font-size:13px}
.kv div b{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.kv div span{display:block;margin-top:1px;word-break:break-word}
.kv .wide{grid-column:1/-1}
.contact{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f6;font-size:13px}
.contact:last-child{border-bottom:none}
.contact .nm{font-weight:700}.contact .rl{color:var(--mut);font-size:12px}
.contact .acts{margin-left:auto;display:flex;gap:6px}
.contact .acts a,.contact .acts button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#e8ecf3;color:var(--navy);text-decoration:none;font-size:15px;border:none;cursor:pointer}
.tl{list-style:none}
.tl li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #eef1f6}
.tl li:last-child{border-bottom:none}
.tl .ic{width:30px;height:30px;border-radius:50%;background:#e8ecf3;display:flex;align-items:center;justify-content:center;font-size:14px}
.tl .hd{font-size:11.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
.tl .hd b{color:var(--navy)}
.tl .nt{font-size:13.5px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.tl .nx{font-size:12px;color:var(--amber);margin-top:3px}
.fab{position:fixed;right:16px;bottom:calc(16px + var(--sab));background:var(--gold);color:#22262e;border:none;border-radius:28px;padding:14px 20px;font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;z-index:60}
.empty{padding:30px 10px;text-align:center;color:var(--mut);font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--sab));background:#22262e;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.pin{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.pin input{font-family:Consolas,monospace;font-size:26px;letter-spacing:12px;text-align:center;width:180px;border:1px solid var(--line);border-radius:8px;padding:10px}
.pin .msg{font-size:12px;color:var(--red);min-height:16px}
.muted{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
code{font-family:Consolas,monospace;font-size:12.5px;background:#eef1f6;padding:1px 5px;border-radius:4px}
.help{font-size:12.5px;line-height:1.5}
.help ol{padding-left:18px}.help li{margin:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:#f7f9fc;text-align:left;padding:7px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid #eef1f6;vertical-align:top}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr{cursor:pointer}.tbl tr:hover td{background:#f2f6fc}
.hideM{display:initial}@media(max-width:700px){.hideM{display:none!important}}
.onlyM{display:none}@media(max-width:700px){.onlyM{display:initial}}
@media(max-width:700px){.hm{display:none!important}}
.kpi.click{cursor:pointer;transition:box-shadow .15s}.kpi.click:hover{border-color:var(--steel);box-shadow:0 2px 8px rgba(31,56,100,.12)}
.card{scroll-margin-top:64px}
.tbl.plain tr{cursor:default}.tbl.plain tr:hover td{background:inherit}
.tbl tr.tot td{font-weight:700;background:#f7f9fc;border-top:2px solid var(--line)}
.tbl tr.dim td{color:#aab2bf}
.tbl .cell{line-height:1.25}.tbl .cell b{display:block;color:var(--navy)}.tbl .cell small{color:var(--mut)}
.kpi.hold .v{color:#b7791f}.kpi.good .v{color:var(--green)}
.mv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.mv .m{border-radius:10px;padding:10px 12px;color:#fff;cursor:pointer;opacity:.92}
.mv .m.on,.mv .m:hover{opacity:1;outline:3px solid rgba(0,0,0,.12)}
.mv .m .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;opacity:.9}
.mv .m .v{font-size:22px;font-weight:700;line-height:1.1}.mv .m .s{font-size:11px;opacity:.9}
.m.won{background:var(--green)}.m.lost{background:var(--red)}.m.hold{background:#b7791f}.m.new{background:var(--navy2)}.m.prog{background:var(--steel)}.m.react{background:#0e6b73}
.var{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;white-space:nowrap}
.var.good{background:#d1fae5;color:#065f46}.var.warn{background:#fef3c7;color:#92400e}.var.bad{background:#fee2e2;color:#991b1b}.var.na{background:#eef1f6;color:#6b7686}
.toolbar input[type=date]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px}
</style>
</head>
<body>
<header>
  <img id="logo" alt="Tibard">
  <h1>Sales <span>Pipeline</span></h1>
  <div class="spacer"></div>
  <div class="sync" id="sync"><i class="local"></i><span id="syncTxt">local</span></div>
  <div class="userchip" id="userChip" style="display:none"></div>
  <button class="ibtn" id="refreshBtn" title="Refresh">&#8635;</button>
  <button class="ibtn" id="settingsBtn" title="Settings">&#9881;</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div id="ovRoot"></div>
<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   Tibard Sales Pipeline — single-file CRM for GitHub Pages
   Data lives as JSON files in a GitHub repo (read/written via the
   GitHub Contents API with a fine-grained token). With no token the app
   runs in local mode (this browser only) so it can be tried out.
   ===================================================================== */
'use strict';

/* ---------- defaults (change DATA_REPO to your data repo) ---------- */
var DEFAULTS = {
  DATA_REPO: 'luke5446/crm-data',   // owner/repo that holds data/*.json
  BRANCH: 'main',
  CONFIG_PATH: 'data/config.json',
  SAGE_PATH: 'data/sage.json',       // Sage net sales per customer per FY (optional)

/* ---------- SHA-256 (sync, works on file:// too) ---------- */
function sha256(ascii){
  function rr(v, a){ return (v >>> a) | (v << (32 - a)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), i, j, result = '';
  var words = [], asciiBitLength = ascii.length * 8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k.length;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); if (j >> 8) return; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((asciiBitLength / maxWord) | 0); words[words.length] = (asciiBitLength);
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), oldHash = hash; hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var temp1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      var temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash); hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
  return result;
}

/* ---------- GitHub Contents API ---------- */
var GH = {
  url: function(path){ return 'https://api.github.com/repos/' + S.repo + '/contents/' + path + '?ref=' + encodeURIComponent(S.branch) + '&_=' + Date.now(); },
  headers: function(){ return { 'Authorization': 'Bearer ' + S.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; },
  b64dec: function(b64){ var bin = atob(b64.replace(/\n/g, '')); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); },
  b64enc: function(str){ var bytes = new TextEncoder().encode(str); var bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); },
  get: function(path){
    return fetch(GH.url(path), { headers: GH.headers(), cache: 'no-store' }).then(function(r){
      if (r.status === 404) return { missing: true };
      if (!r.ok) return r.text().then(function(t){ throw new Error('GitHub ' + r.status + ' reading ' + path + (r.status === 401 ? ' — token invalid or expired' : r.status === 403 ? ' — token has no access to ' + S.repo : '')); });
      return r.json().then(function(j){
        if (j.content) return { sha: j.sha, json: JSON.parse(GH.b64dec(j.content)) };
        // >1MB: fetch blob
        return fetch('https://api.github.com/repos/' + S.repo + '/git/blobs/' + j.sha, { headers: GH.headers(), cache: 'no-store' }).then(function(b){ return b.json(); }).then(function(b){ return { sha: j.sha, json: JSON.parse(GH.b64dec(b.content)) }; });
      });
    });
  },
  put: function(path, obj, sha, msg){
    var body = { message: msg || ('Update ' + path), content: GH.b64enc(JSON.stringify(obj, null, 1)), branch: S.branch };
    if (sha) body.sha = sha;
    return fetch('https://api.github.com/repos/' + S.repo + '/contents/' + path, { method: 'PUT', headers: GH.headers(), body: JSON.stringify(body) }).then(function(r){
      if (r.status === 409 || r.status === 422) { var e = new Error('conflict'); e.conflict = true; throw e; }
      if (!r.ok) return r.text().then(function(t){ throw new Error('GitHub ' + r.status + ' saving ' + path + (r.status === 403 || r.status === 401 ? ' — token cannot write to ' + S.repo : '') ); });
      return r.json();
    }).then(function(j){ return j.content.sha; });
  }
};

  }
  var raw = LS.get('file.' + path);
  return Promise.resolve(raw ? JSON.parse(raw) : fallback);
}
function writeFile(path, obj, msg){
  obj.updatedAt = nowISO();
  if (S.mode === 'github') {
    return GH.put(path, obj, S.shas[path], msg).then(function(sha){ S.shas[path] = sha; delete S.missing[path]; });
  }
  LS.set('file.' + path, JSON.stringify(obj));

}

/* merge a remote copy into local (record-level, newest updatedAt wins; activities union) */
function mergeRep(local, remote){
  ['accounts', 'contacts', 'opportunities'].forEach(function(c){
    if (!remote[c]) return; local[c] = local[c] || [];
    var byId = {}; local[c].forEach(function(r){ byId[r.id] = r; });
    remote[c].forEach(function(r){ var l = byId[r.id]; if (!l) local[c].push(r); else if ((r.updatedAt || '') > (l.updatedAt || '')) Object.assign(l, r); });
  });
  if (remote.activities) { var ids = {}; (local.activities = local.activities || []).forEach(function(a){ ids[a.id] = 1; }); remote.activities.forEach(function(a){ if (!ids[a.id]) local.activities.push(a); }); }
  return local;
}

function pathFor(key){ if (key === 'sage') return S.cfg.sagePath || DEFAULTS.SAGE_PATH; if (key === 'config') return DEFAULTS.CONFIG_PATH; var u = userByKey(key); return u && u.file; }

var saveQ = Promise.resolve();
function save(key, msg){
  var path = pathFor(key);
  saveQ = saveQ.then(function(){
    setSync('busy', 'saving…');
    var attempt = function(n){
      return writeFile(path, objFor(key), msg).catch(function(e){
        if (e.conflict && n < 3) {
          return GH.get(path).then(function(r){ if (!r.missing) { S.shas[path] = r.sha; mergeRep(objFor(key), r.json); } return attempt(n + 1); });
        }
        throw e;
      });
    };
    return attempt(0).then(function(){ setSync(S.mode === 'github' ? 'ok' : 'local', S.mode === 'github' ? 'saved ' + new Date().toTimeString().slice(0, 5) : 'local only'); toast('Saved'); })
      .catch(function(e){ setSync('err', 'save failed'); S.error = e.message; render(); alert('Save failed: ' + e.message); });
  });
  return saveQ;
}

function loadAll(){

  });
  if (k.wonAll + k.lostAll) k.winRate = Math.round(100 * k.wonAll / (k.wonAll + k.lostAll));
  return k;
}

function bdCurrentFY(){ return bdFyOf(today()); }
function bdPrevFY(label){ var y = +label.split('/')[0] - 1; return y + '/' + pad((y + 1) % 100); }

/* Every opportunity with its normalised stage events {at, from, to, by}: from stageHistory,
   else rebuilt from "Stage: A → B" activity notes, else from the current stage / wonDate. */
function bdOpps(){
  if (bdOpps._c && bdOpps._basis === S.board.basis) return bdOpps._c;
  var out = [];
  repUsers().forEach(function(u){
    var rep = S.data[u.key]; if (!rep) return;
    var acts = {}; (rep.activities || []).forEach(function(a){ if (a.oppId) (acts[a.oppId] = acts[a.oppId] || []).push(a); });
    (rep.opportunities || []).forEach(function(o){ var acc = accOf(rep, o.accountId), wd = wonDateOf(o, acc); out.push({ o: o, acc: acc, rep: u, repKey: u.key, wd: wd, events: bdEvents(o, acts[o.id] || [], wd), value: bdValue(o) }); });
  });
  bdOpps._c = out; bdOpps._basis = S.board.basis;
  return out;
}
/* The won date shown and reported: the Sage account-opened date when the file has one,
   unless the rep deliberately set a different date (o.wonDateManual). */
function sageOpenedFor(acc){ var cu = acc && bdSageFor(acc); return cu && cu.opened ? cu.opened : null; }
function wonDateOf(o, acc){ if (o.stage !== 'Won') return o.wonDate || null; if (o.wonDateManual) return o.wonDate || null; return sageOpenedFor(acc) || o.wonDate || null; }
function bdEvents(o, acts, wd){
  var ev = [];

    o.stageHistory.forEach(function(e){ ev.push({ at: e.at, from: e.from || null, to: e.to, by: e.by || '' }); });
    if (ev[0].from) ev.unshift({ at: o.createdAt || ev[0].at, from: null, to: ev[0].from, by: o.createdBy || '' });
  } else {
    var trans = [];
    acts.slice().sort(bdSort(function(a){ return a.at || ''; })).forEach(function(a){ var m = BD_STAGE_RX.exec(a.note || ''); if (m) trans.push({ at: a.at, from: m[1].trim(), to: m[2].trim(), by: a.by || '' }); });
    ev.push({ at: o.createdAt, from: null, to: trans.length ? trans[0].from : (o.stage === 'Won' ? 'Account set-up' : o.stage), by: o.createdBy || '' });
    ev = ev.concat(trans);
  }

  if (o.stage === 'Won' && wd) { for (var i = ev.length - 1; i >= 0; i--) if (ev[i].to === 'Won') { ev[i].at = wd + 'T12:00:00'; break; } }
  return ev;
}
function bdMovements(from, to, repKey){
  var rows = [];
  bdOpps().forEach(function(x){
    if (repKey && x.repKey !== repKey) return;
    x.events.forEach(function(e){
      var d = (e.at || '').slice(0, 10); if (!d || d < from || d > to) return;
      var kind;
      if (e.from === null) kind = 'new';
      else if (e.to === 'Won') kind = 'won';
      else if (e.to === 'Lost') kind = 'lost';
      else if (e.to === 'On hold') kind = 'hold';
      else if ((e.from === 'On hold' || e.from === 'Lost') && bdActive(e.to)) kind = 'react';
      else if (bdStageIdx(e.to) > bdStageIdx(e.from)) kind = 'prog';
      else kind = 'back';
      if (kind === 'new' && x.events.length === 1 && (e.to === 'Won' || e.to === 'Lost')) kind = e.to === 'Won' ? 'won' : 'lost';
      rows.push({ x: x, e: e, kind: kind, at: e.at });
    });
  });
  return rows.sort(bdSort(function(r){ return r.at || ''; }, -1));
}
function bdKindLabel(k){ for (var i = 0; i < BD_KINDS.length; i++) if (BD_KINDS[i][0] === k) return BD_KINDS[i][1]; return k; }
function bdOutcomes(from, to, repKey){
  var r = { won: { n: 0, v: 0 }, lost: { n: 0, v: 0 }, hold: { n: 0, v: 0 }, 'new': { n: 0, v: 0 } };
  bdMovements(from, to, repKey).forEach(function(m){ if (r[m.kind]) { r[m.kind].n++; r[m.kind].v += m.x.value; } });
  r.closed = r.won.n + r.lost.n; r.conv = r.closed ? r.won.n / r.closed : null;
  return r;
}
function bdRange(){
  var t = today(), fy = bdCurrentFY(), b = S.board, now = bdToDate(t);
  switch (b.period) {
    case 'week': return { from: bdYmd(bdWeekStart(now)), to: t, label: 'This week' };
    case '4w': { var d = bdWeekStart(now); d.setDate(d.getDate() - 21); return { from: bdYmd(d), to: t, label: 'Last 4 weeks' }; }
    case 'fy': return { from: bdFyRange(fy).from, to: t, label: 'FY ' + fy + ' to date' };
    case 'lastfy': { var r = bdFyRange(bdPrevFY(fy)); return { from: r.from, to: r.to, label: 'FY ' + bdPrevFY(fy) }; }
    case '12m': { var m = new Date(); m.setMonth(m.getMonth() - 11); m.setDate(1); return { from: bdYmd(m), to: t, label: 'Last 12 months' }; }
    case 'all': return { from: '0000-00-00', to: t, label: 'All time' };
    case 'custom': return { from: b.from || '0000-00-00', to: b.to || t, label: (b.from ? fmtDate(b.from) : 'start') + ' – ' + (b.to ? fmtDate(b.to) : 'today') };
    default: return { from: t.slice(0, 7) + '-01', to: t, label: 'This month' };
  }
}
/* Weeks run Monday to Sunday. */
function bdWeekStart(d){ var x = new Date(d.getTime()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(12, 0, 0, 0); return x; }
function bdWeeksIn(from, to){
  var t = today(); if (to > t) to = t;
  if (from === '0000-00-00') { var min = t; bdOpps().forEach(function(x){ var k = (x.events[0].at || '').slice(0, 10); if (k && k < min) min = k; }); from = min; }
  var keys = [], d = bdWeekStart(bdToDate(from)), end = bdToDate(to);

/* Lead cohort: opportunities CREATED in the window and what has become of them since. */
function bdCohort(from, to, repKey){

  bdOpps().forEach(function(x){
    if (repKey && x.repKey !== repKey) return;
    var created = ((x.events[0] && x.events[0].at) || x.o.createdAt || '').slice(0, 10);
    if (!created || created < from || created > to) return;

    if (x.o.stage === 'Won') { c.won++; c.wonV += x.value; } else if (x.o.stage === 'Lost') c.lost++; else if (x.o.stage === 'On hold') c.hold++; else c.open++;
  });

}
function bdConv(c){ return c.conv == null ? '—' : Math.round(c.conv * 100) + '%'; }
function bdMonthsIn(from, to){
  var keys = [], t = today().slice(0, 7);
  if (from === '0000-00-00') { var min = t; bdOpps().forEach(function(x){ x.events.forEach(function(e){ var k = (e.at || '').slice(0, 7); if (k && k < min) min = k; }); }); from = min + '-01'; }

}
function bdSageFor(acc){ var code = (acc.sageCode || '').trim().toUpperCase(); if (!code || !S.sage || !S.sage.customers) return null; return S.sage.customers[code] || null; }
function bdSageRows(repKey){
  var rows = [];
  bdOpps().forEach(function(x){
    if (x.o.stage !== 'Won' || (repKey && x.repKey !== repKey)) return;
    var wonAt = x.wd || (x.events.filter(function(e){ return e.to === 'Won'; }).pop() || {}).at || x.o.updatedAt;

    '<select onchange="S.filters[\'' + key + '\'].stage=this.value;render()">' + [['open', 'Open (not won/lost)'], ['active', 'Active (excl. on hold)'], ['week', 'Due this week / overdue'], ['all', 'All']].concat(S.cfg.stages.map(function(s){ return [s, s]; })).map(function(o){ return '<option value="' + h(o[0]) + '"' + (f.stage === o[0] ? ' selected' : '') + '>' + h(o[1]) + '</option>'; }).join('') + '</select>' +
    '<select onchange="S.filters[\'' + key + '\'].sort=this.value;render()">' + [['next', 'Next action'], ['value', 'Annual value'], ['weighted', 'Weighted'], ['updated', 'Last updated'], ['name', 'Company A–Z']].map(function(o){ return '<option value="' + o[0] + '"' + (f.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
    '<button class="btn btn-sm hideM" onclick="S.filters[\'' + key + '\'].view=\'' + (f.view === 'list' ? 'board' : 'list') + '\';render()">' + (f.view === 'list' ? 'Board view' : 'List view') + '</button></div>';

  var q = f.q.toLowerCase(), we = weekEnd();
  var rows = rep.opportunities.map(function(o){ return { o: o, acc: accOf(rep, o.accountId), cs: contactsOf(rep, o.accountId) }; }).filter(function(x){
    var o = x.o;
    if (f.stage === 'open' && !isOpen(o)) return false;
    if (f.stage === 'active' && !isActive(o)) return false;
    if (f.stage === 'week' && !(isOpen(o) && o.nextActionDue && o.nextActionDue <= we)) return false;
    if (S.cfg.stages.indexOf(f.stage) >= 0 && o.stage !== f.stage) return false;
    if (q) { var blob = [x.acc.name, x.acc.location, x.acc.sector, x.acc.sageCode, x.acc.brief, o.nextAction, o.title].concat(x.cs.map(function(c){ return c.name + ' ' + c.role; })).join(' ').toLowerCase(); var notes = rep.activities.filter(function(a){ return a.oppId === o.id; }).map(function(a){ return a.note; }).join(' ').toLowerCase(); if (blob.indexOf(q) < 0 && notes.indexOf(q) < 0) return false; }
    return true;
  });
  var sorters = { next: function(a, b){ var x = a.o.nextActionDue, y = b.o.nextActionDue; if (x && y) return x.localeCompare(y); if (x) return -1; if (y) return 1; return (b.o.updatedAt || '').localeCompare(a.o.updatedAt || ''); }, value: function(a, b){ return (b.o.annualValue || 0) - (a.o.annualValue || 0); }, weighted: function(a, b){ return weighted(b.o) - weighted(a.o); }, updated: function(a, b){ return (b.o.updatedAt || '').localeCompare(a.o.updatedAt || ''); }, name: function(a, b){ return a.acc.name.localeCompare(b.acc.name); } };
  rows.sort(sorters[f.sort] || sorters.next);

  } else html += '<div class="olist">' + rows.map(function(x){ return oppCard(key, x); }).join('') + '</div>';

/* Won date defaults to the date the Sage account was opened (from the spend file); the rep can override it, e.g. an old account won back. */
function sageOpened(code, keep){
  var hint = $('sageHint'), w = $('sb') && $('sb').querySelector('[data-f=wonDate]'); if (!hint || !w) return;
  code = (code || '').trim().toUpperCase();
  var cu = code && S.sage && S.sage.customers ? S.sage.customers[code] : null;
  if (!code) { hint.textContent = 'Type the Sage account number: the won date is taken from when the account was opened in Sage.'; return; }
  if (!cu) { hint.textContent = 'Not in the Sage spend file' + (S.sage && S.sage.updatedAt ? ' (uploaded ' + fmtDate(S.sage.updatedAt) + ')' : '') + '. The won date stays as entered.'; return; }
  if (cu.opened) { if (!keep) w.value = cu.opened; hint.textContent = (cu.name ? cu.name + ': ' : '') + 'Sage account opened ' + fmtDate(cu.opened) + (keep ? '. Won date kept as entered.' : ', used as the won date. Change it if this is an old account won back.'); }

}
function stageExtra(stage, o, acc){

  else if (stage === 'Lost') el.innerHTML = fld('Lost reason', 'lostReason', o.lostReason || '', 'text', { span: true, ph: 'Pick or type a reason', list: 'lostReasons' }) + reasonList('lostReasons', lostReasons());
  else if (stage === 'On hold') el.innerHTML = fld('Why on hold?', 'holdReason', o.holdReason || '', 'text', { ph: 'Pick or type a reason', list: 'holdReasons' }) + fld('Revisit on', 'holdUntil', o.holdUntil || '', 'date') + reasonList('holdReasons', holdReasons());
  else el.innerHTML = '';

function saveUpdate(key, id){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0], acc = accOf(rep, o.accountId);
  var f = readForm(), chip = $('atype').querySelector('.chip.on'), type = chip ? chip.getAttribute('data-t') : 'Note';
  if (!f.note.trim() && f.stage === o.stage && f.nextAction === (o.nextAction || '') && f.nextActionDue === (o.nextActionDue || '')) { alert('Add a note or change something first.'); return; }
  var who = S.user.name, at = nowISO(), note = f.note.trim();
  if (f.stage !== o.stage) note = (note ? note + '\n' : '') + 'Stage: ' + o.stage + ' → ' + f.stage;
  rep.activities.push({ id: uid('act'), oppId: o.id, accountId: o.accountId, type: type, note: note, nextAction: f.nextAction, nextActionDue: f.nextActionDue || null, at: at, by: who });
  o.nextAction = f.nextAction; o.nextActionDue = f.nextActionDue || null; o.lastActivityAt = at;
  if (f.stage !== o.stage) { logStage(o, o.stage, f.stage); o.stage = f.stage; if (f.stage === 'Won') { if (f.sageCode) { acc.sageCode = f.sageCode.trim().toUpperCase(); stamp(acc); } var so = sageOpenedFor(acc); o.wonDate = f.wonDate || so || today(); o.wonDateManual = !!(so && o.wonDate !== so); acc.type = 'Existing customer'; } if (f.stage === 'Lost') o.lostReason = f.lostReason || ''; if (f.stage === 'On hold') { o.holdReason = (f.holdReason || '').trim(); o.holdUntil = f.holdUntil || null; if (f.holdUntil && !o.nextActionDue) { o.nextActionDue = f.holdUntil; o.nextAction = o.nextAction || 'Revisit'; } } }
  else if (f.stage === 'Won' && f.sageCode && f.sageCode !== acc.sageCode) { acc.sageCode = f.sageCode.trim().toUpperCase(); stamp(acc); }
  stamp(o);
  save(key, who + ': update ' + acc.name);
  openOpp(key, id); render();
}

/* ---------- Sage spend import (admin) ---------- */
function parseCSV(text){
  var rows = [], row = [], cur = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return c.trim() !== ''; }); });
}
/* Column names are matched loosely (case, spaces and punctuation ignored) so Sage 50 and Sage 200 exports work as they come. */
var SAGE_COLS = {
  code: ['code', 'ac', 'acref', 'accountref', 'accountreference', 'account', 'accountcode', 'accountnumber', 'accountno', 'customercode', 'customeraccount', 'customeraccountnumber', 'customeraccountno', 'custaccountno', 'sagecode'],
  name: ['name', 'customer', 'customername', 'accountname', 'shortname', 'customershortname'],
  date: ['date', 'invoicedate', 'transactiondate', 'transdate', 'postingdate', 'posteddate', 'documentdate', 'docdate', 'invdate'],
  net: ['net', 'nett', 'netamount', 'nettamount', 'netvalue', 'nettvalue', 'goodsvalue', 'goods', 'goodsvaluebase', 'amount', 'total', 'value'],
  fy: ['fy', 'financialyear', 'year'], spend: ['spend', 'annualspend', 'turnover', 'sales'],
  thisYear: ['turnoverthisyear', 'thisyear', 'thisyearturnover', 'turnoverytd', 'ytd', 'ytdturnover', 'currentyear', 'turnovercurrentyear', 'salesthisyear', 'turnoveryeartodate', 'yeartodate'],
  lastYear: ['turnoverlastyear', 'lastyear', 'lastyearturnover', 'prioryear', 'previousyear', 'turnoverprioryear', 'turnoverpreviousyear', 'saleslastyear'],
  type: ['type', 'transactiontype', 'trantype', 'doctype', 'documenttype', 'tt'],
  opened: ['opened', 'dateopened', 'openeddate', 'dateaccountopened', 'accountopened', 'accountopeneddate', 'datecreated', 'created']
};
/* Sage transaction types: invoices count, credit notes subtract, receipts / payments / allocations are ignored. */
function sageSign(t){ t = String(t || '').trim().toLowerCase(); if (!t) return 1; if (/^(sc|scr|cr|crn)$|credit/.test(t)) return -1; if (/^(si|inv)$|invoice/.test(t)) return 1; return 0; }
function sageNum(v){ v = String(v == null ? '' : v).replace(/[£,\s]/g, ''); if (/^\(.*\)$/.test(v)) v = '-' + v.slice(1, -1); var n = parseFloat(v); return isNaN(n) ? 0 : n; }
var SAGE_MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
/* UK dates as Sage / Excel write them: 28/09/2026, 28-09-2026, 28.09.26, 28 Sep 2026, 2026-09-28, any of them with a trailing time. Never US month-first. */
function sageDate(v){
  v = String(v || '').trim().replace(/[T ]\d{1,2}:\d{2}(:\d{2})?(\.\d+)?\s*(am|pm)?$/i, '').trim();
  var m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/.exec(v); if (m) { var y = +m[3]; if (y < 100) y += 2000; return y + '-' + pad(+m[2]) + '-' + pad(+m[1]); }
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v); if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  m = /^(\d{1,2})[ \-\/]([A-Za-z]{3})[A-Za-z]*[ \-\/,]+(\d{2,4})$/.exec(v); if (m && SAGE_MONTHS[m[2].toLowerCase()]) { var y2 = +m[3]; if (y2 < 100) y2 += 2000; return y2 + '-' + pad(SAGE_MONTHS[m[2].toLowerCase()]) + '-' + pad(+m[1]); }
  m = /^(\d{4})(\d{2})(\d{2})$/.exec(v); if (m) return m[1] + '-' + m[2] + '-' + m[3];
  return '';
}
function sageDateOk(d){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d); return !!m && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31; }
function importSageCSV(){
  var inp = $('sageCsv'), f = readForm(); if (!inp || !inp.files.length) { alert('Choose the CSV export first'); return; }
  inp.files[0].text().then(function(text){
    var rows = parseCSV(text); if (rows.length < 2) throw new Error('No rows found');
    var head = rows[0].map(function(h){ return h.toLowerCase().replace(/[^a-z0-9]/g, ''); });
    var col = function(k){ for (var i = 0; i < head.length; i++) if (SAGE_COLS[k].indexOf(head[i]) >= 0) return i; return -1; };
    var ci = { code: col('code'), name: col('name'), date: col('date'), net: col('net'), fy: col('fy'), spend: col('spend'), thisYear: col('thisYear'), lastYear: col('lastYear'), type: col('type'), opened: col('opened') };
    if (ci.code < 0) throw new Error('No account code column (A/C, Account Number, Account Ref or Code)');
    var layout = (ci.fy >= 0 && ci.spend >= 0) ? 'summary' : ci.thisYear >= 0 ? 'turnover' : (ci.date >= 0 && ci.net >= 0) ? 'lines' : '';
    if (!layout) throw new Error('Need Date + Net columns (invoice lines), Turnover This Year [+ Last Year] (customer list), or FY + Spend');
    var summarised = layout === 'summary', fyNow = bdFyOf(today()), fyPrev = bdPrevFY(fyNow);
    var sage = (S.sage && f.sageMode !== 'replace') ? S.sage : { updatedAt: nowISO(), source: '', fyStartMonth: S.cfg.fyStartMonth || 2, customers: {} };
    if (f.sageMode === 'replace' && S.sage) Object.keys(S.sage.customers || {}).forEach(function(k){ sage.customers[k] = { name: S.sage.customers[k].name, spend: {} }; });
    var n = 0, bad = 0, opened = 0, badOpened = [];
    rows.slice(1).forEach(function(r){
      var code = (r[ci.code] || '').trim().toUpperCase(); if (!code) return;
      var cu = sage.customers[code] = sage.customers[code] || { name: '', spend: {} };
      if (ci.name >= 0 && r[ci.name] && !cu.name) cu.name = r[ci.name].trim();
      if (ci.opened >= 0) { var od = sageDate(r[ci.opened]); if (od && sageDateOk(od)) { cu.opened = od; opened++; } else if (String(r[ci.opened] || '').trim() && badOpened.length < 3) badOpened.push(r[ci.opened]); }
      var fy, amt;
      if (layout === 'turnover') {
        cu.spend[fyNow] = Math.round(sageNum(r[ci.thisYear]) * 100) / 100;
        if (ci.lastYear >= 0) cu.spend[fyPrev] = Math.round(sageNum(r[ci.lastYear]) * 100) / 100;
        n++; return;
      }
      if (summarised) { fy = String(r[ci.fy] || '').trim().replace('-', '/'); amt = sageNum(r[ci.spend]); }
      else { var d = sageDate(r[ci.date]); if (!d || !sageDateOk(d)) { bad++; return; } fy = bdFyOf(d); amt = sageNum(r[ci.net]); if (ci.type >= 0) { var sg = sageSign(r[ci.type]); if (!sg) return; amt = Math.abs(amt) * sg; } }
      if (!fy) { bad++; return; }
      cu.spend[fy] = Math.round(((cu.spend[fy] || 0) + amt) * 100) / 100; n++;
    });
    sage.source = inp.files[0].name; sage.fyStartMonth = S.cfg.fyStartMonth || 2;
    S.sage = sage;
    return save('sage', S.user.name + ': Sage spend from ' + inp.files[0].name).then(function(){ var msg = n + ' rows applied' + (bad ? ', ' + bad + ' skipped' : '') + (ci.opened >= 0 ? ' · ' + opened + ' opened dates' : ''); toast(msg, 4000); if (badOpened.length) alert(msg + '.\n\nSome Opened values could not be read, e.g. "' + badOpened.join('", "') + '". Format the column as a date (dd/mm/yyyy) before saving the CSV.'); openSettings(); render(); });
  }).catch(function(e){ alert('Import failed: ' + e.message); });
}

/* ---------- users (admin) ---------- */
function accessLabel(u){ var e = u.edits || []; if (e.indexOf('config') >= 0) return 'Admin'; if (u.file) return 'Sales rep'; return 'View only'; }
function accessOf(u){ var e = u.edits || []; if (e.indexOf('config') >= 0) return 'admin'; if (u.file) return 'rep'; return 'viewer'; }
function slugKey(name){ var k = name.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 20) || 'user'; var base = k, n = 2; while (userByKey(k)) k = base + n++; return k; }
function openUser(key){
  var u = key ? userByKey(key) : null, isNew = !u;
  var body = '<div class="grid">' + fld('Name', 'uName', u ? u.name : '', 'text', { span: true, ph: 'e.g. Sam Jones' }) + fld('Job title', 'uRole', u ? u.role : '', 'text', { span: true, ph: 'e.g. BDM' }) +
    fld('Access', 'uAccess', u ? accessOf(u) : 'rep', 'select', { span: true, options: [['rep', 'Sales rep — own pipeline'], ['admin', 'Admin — everything incl. users & PINs'], ['viewer', 'View only']] }) +
    fld(isNew ? 'PIN (4–6 digits)' : 'New PIN (leave blank to keep)', 'uPin', '', 'text', { span: true, attrs: ' inputmode="numeric" autocomplete="off"' }) + '</div>' +
    (u && u.file ? '<div class="help" style="margin-top:8px">Pipeline file: <code>' + h(u.file) + '</code>. Changing a rep to another access type keeps their file and pipeline data.</div>' : '');
  openSheet(isNew ? 'Add user' : 'Edit user', body, '<button class="btn" onclick="openSettings()">Back</button><button class="btn btn-gold" onclick="saveUser(' + (u ? '\'' + u.key + '\'' : 'null') + ')">Save</button>');
}
function saveUser(key){
  var f = readForm(), u = key ? userByKey(key) : null, name = f.uName.trim(), role = f.uRole.trim(), pin = f.uPin.trim();
  if (!name) { alert('Enter a name'); return; }
  if (!u && !pin) { alert('Set a PIN for the new user'); return; }
  if (pin && !/^\d{4,6}$/.test(pin)) { alert('PIN must be 4–6 digits'); return; }
  var hsh = pin ? sha256(pin) : null;
  if (hsh && S.cfg.users.some(function(x){ return x.pinHash === hsh && x !== u; })) { alert('Another user already has that PIN — choose a different one.'); return; }
  if (u && u.key === S.user.key && f.uAccess !== 'admin') { alert('You cannot remove your own admin access.'); return; }
  var jobs = [];
  if (!u) { u = { key: slugKey(name), name: name, role: role || 'Sales', pinHash: hsh, edits: [] }; S.cfg.users.push(u); }
  else { u.name = name; u.role = role || u.role; if (hsh) u.pinHash = hsh; }
  if (f.uAccess === 'rep' && !u.file) { u.file = 'data/' + u.key + '.json'; }
  if (f.uAccess === 'rep' && !S.data[u.key]) { S.data[u.key] = emptyRep(u); jobs.push(function(){ return writeFile(u.file, S.data[u.key], 'Create ' + u.file); }); }
  if (u.file && S.data[u.key] && S.data[u.key].owner !== name) { S.data[u.key].owner = name; jobs.push(function(){ return save(u.key, 'Rename rep to ' + name); }); }
  var repKeys = repUsers().map(function(r){ return r.key; });
  u.edits = f.uAccess === 'admin' ? repKeys.concat(['config']) : f.uAccess === 'rep' ? [u.key] : [];
  // every admin can edit every rep
  S.cfg.users.forEach(function(x){ if ((x.edits || []).indexOf('config') >= 0) repKeys.forEach(function(k){ if (x.edits.indexOf(k) < 0) x.edits.push(k); }); });
  if (S.user.key === u.key) S.user = u;
  jobs.push(function(){ return save('config', (key ? 'Update user ' : 'Add user ') + name); });
  jobs.reduce(function(p, j){ return p.then(j); }, Promise.resolve()).then(function(){ toast((key ? 'Updated ' : 'Added ') + name); openSettings(); render(); });
}
function deleteUser(key){
  var u = userByKey(key); if (!u) return;
  var n = u.file && S.data[key] ? S.data[key].opportunities.length : 0;
  if (!confirm('Remove ' + u.name + ' from the CRM?' + (n ? '\n\nTheir ' + n + ' opportunities will no longer show in the app. The file ' + u.file + ' stays in the data repo so nothing is lost.' : ''))) return;
  S.cfg.users = S.cfg.users.filter(function(x){ return x.key !== key; });
  S.cfg.users.forEach(function(x){ x.edits = (x.edits || []).filter(function(e){ return e !== key; }); });
  delete S.data[key];
  save('config', 'Remove user ' + u.name).then(function(){ toast('Removed ' + u.name); openSettings(); render(); });
}
function seedRepo(){
  if (!confirm('Create the data files in ' + S.repo + ' now? Missing files are created from the imported pipeline (Lindsay) and empty templates.')) return;
  var jobs = [];
  if (S.missing[DEFAULTS.CONFIG_PATH]) jobs.push(function(){ return writeFile(DEFAULTS.CONFIG_PATH, S.cfg, 'Create config'); });
  repUsers().forEach(function(u){ if (S.missing[u.file]) jobs.push(function(){ if (SEED[u.key] && !S.data[u.key].opportunities.length) S.data[u.key] = JSON.parse(JSON.stringify(SEED[u.key])); return writeFile(u.file, S.data[u.key], 'Create ' + u.file); }); });
  setSync('busy', 'creating…');
  jobs.reduce(function(p, j){ return p.then(j); }, Promise.resolve()).then(function(){ S.missing = {}; setSync('ok', 'synced'); toast('Data files created'); render(); }).catch(function(e){ setSync('err', 'error'); alert('Could not create files: ' + e.message); });
}

/* ---------- export ---------- */
function exportCSV(){
  var cols = ['Owner', 'Company', 'Location', 'Sector', 'Type', 'Sage code', 'Staff', 'Main contact', 'Role', 'Phone', 'Email', 'Title', 'Stage', '% chance', '1st order value', 'Annual value', 'Weighted', 'Expected start', 'Next action', 'Due', 'Last activity', 'Created', 'Won on', 'Lost reason'];
  var rows = [cols];
  allOpps().forEach(function(x){ var o = x.o, a = x.acc, c = contactsOf(x.rep, a.id).filter(function(c){ return c.primary; })[0] || contactsOf(x.rep, a.id)[0] || {}; rows.push([x.rep.owner, a.name, a.location, a.sector, a.type, a.sageCode, a.staff, c.name, c.role, c.phone, c.email, o.title, o.stage, o.probability, o.firstOrderValue, o.annualValue, Math.round(weighted(o)), o.expectedStart, o.nextAction, o.nextActionDue, fmtDT(o.lastActivityAt), fmtDate(o.createdAt), o.wonDate, o.lostReason]); });
  var csv = rows.map(function(r){ return r.map(function(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
  download('pipeline-' + today() + '.csv', '﻿' + csv, 'text/csv');
}
function exportJSON(){ download('crm-backup-' + today() + '.json', JSON.stringify({ config: S.cfg, data: S.data, sage: S.sage }, null, 1), 'application/json'); }
function download(name, content, type){ var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type: type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ---------- boot ---------- */
function boot(){
  $('logo').src = TIBARD_LOGO;
  // token link: #token=...&repo=owner/repo
  if (location.hash && location.hash.indexOf('token=') >= 0) {
    var p = new URLSearchParams(location.hash.slice(1));
    if (p.get('token')) LS.set('token', p.get('token'));
    if (p.get('repo')) LS.set('repo', p.get('repo'));
    history.replaceState(null, '', location.pathname + location.search);
  }
  S.token = LS.get('token') || ''; S.repo = LS.get('repo') || DEFAULTS.DATA_REPO; S.branch = LS.get('branch') || DEFAULTS.BRANCH;
  S.mode = S.token ? 'github' : 'local';
  S.tab = LS.get('tab') || 'kpi';
  $('refreshBtn').onclick = function(){ S.data = {}; loadAll().then(render); };
  $('settingsBtn').onclick = openSettingsGuarded;
  render();
  loadAll().then(function(){ restoreUser(); if (S.user && !userByKey(S.user.key)) S.user = null; render(); });
  setInterval(function(){ if (S.mode === 'github' && !document.hidden && !$('ovRoot').innerHTML) { S.data = {}; loadAll().then(render); } }, DEFAULTS.REFRESH_MS);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.mode === 'github' && !$('ovRoot').innerHTML) { S.data = {}; loadAll().then(render); } });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
}
boot();
</script>
