<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F3864">
<title>Tibard Sales Pipeline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F3864'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23C9A24B'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root{
  --navy:#1F3864; --navy2:#2a4a80; --steel:#5b7ba6; --gold:#C9A24B;
  --bg:#f4f6f9; --card:#ffffff; --line:#dfe4ec; --txt:#1c2431; --mut:#6b7686;
  --red:#c0392b; --green:#1e7e46; --amber:#92400e;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--navy2)}

/* ---- header (matches Costing Calculator) ---- */
header{background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
header img{height:34px;background:#fff;border-radius:6px;padding:3px 8px}
header h1{font-size:17px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
header h1 span{color:var(--gold)}
header .spacer{flex:1}
@media(max-width:700px){header{gap:8px;padding-left:12px;padding-right:12px}header img{height:28px;padding:2px 6px}header h1{font-size:15px}.sync span{display:none}#refreshBtn{display:none}.userchip{padding:5px 8px;font-size:11.5px}.ibtn{flex-shrink:0}}
@media(max-width:480px){header h1{display:none}}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;opacity:.85;white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:#9aa6b8;display:inline-block}
.sync i.ok{background:#3ddc84}.sync i.busy{background:var(--gold);animation:pulse 1s infinite}.sync i.err{background:#ff6b5b}.sync i.local{background:#9aa6b8}
@keyframes pulse{50%{opacity:.3}}
.ibtn{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn.gold{background:var(--gold);color:#22262e}
.userchip{font-size:12px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:14px;white-space:nowrap}
.userchip b{color:var(--gold)}

/* ---- tabs ---- */
nav.tabs{background:var(--navy);display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(54px + var(--sat));z-index:49}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
nav.tabs button.on{background:var(--gold);color:#22262e}
nav.tabs button .lock{font-size:11px;opacity:.8}
nav.tabs button .cnt{font-size:11px;background:rgba(0,0,0,.18);border-radius:10px;padding:1px 7px}

main{max-width:1180px;margin:0 auto;padding:14px 14px calc(80px + var(--sab))}
.banner{background:#fffbea;border:1px solid #f1e3a4;color:#7A5B14;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:#fee2e2;border-color:#f3b4b4;color:#991b1b}
.banner .lnk{font-weight:700;cursor:pointer;text-decoration:underline}

/* ---- buttons / fields ---- */
.btn{border:none;border-radius:6px;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600;background:#e8ecf3;color:var(--navy);white-space:nowrap}
.btn:hover{background:#dde3ee}
.btn-gold{background:var(--gold);color:#22262e}.btn-gold:hover{background:#d5b25f}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy2)}
.btn-red{background:#fee2e2;color:#991b1b}
.btn-sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:10px 11px;font-size:15px;outline:none;background:#fff;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--steel)}
.field textarea{min-height:80px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.grid .span2{grid-column:span 2}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.grid .span2,.grid .mspan{grid-column:span 2}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--mut)}
.chips .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips .chip.gold.on{background:var(--gold);border-color:var(--gold);color:#22262e}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(20,30,50,.06);overflow:hidden;margin-bottom:12px}
.card h2{font-size:14px;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--navy);display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-size:12px;font-weight:400;color:var(--mut)}
.card .body{padding:12px 14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;outline:none;background:#fff}
.toolbar input[type=search]:focus{border-color:var(--steel)}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;font-size:13px}

/* opportunity list */
.olist{display:flex;flex-direction:column;gap:8px}
.opp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,50,.05);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.opp:hover{border-color:var(--steel)}
.opp .co{font-weight:700;font-size:15px;color:var(--navy)}
.opp .meta{font-size:12px;color:var(--mut);grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.opp .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.opp .val small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.opp .next{grid-column:1/-1;font-size:12.5px;margin-top:2px;display:flex;gap:6px;align-items:baseline}
.opp .next .due{font-weight:700;white-space:nowrap}
.due.over{color:var(--red)}.due.soon{color:var(--amber)}.due.ok{color:var(--green)}
.stg{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.2px;white-space:nowrap;background:#e8ecf3;color:var(--navy)}
.stg[data-s="Lead"]{background:#eef1f6;color:#6b7686}
.stg[data-s="Contacted"]{background:#e6edf7;color:#2a4a80}
.stg[data-s="Quoted"]{background:#fbf3dc;color:#7A5B14}
.stg[data-s="Samples"]{background:#ece6f7;color:#5b3f9e}
.stg[data-s="Account set-up"]{background:#dff3f3;color:#0e6b73}
.stg[data-s="Won"]{background:#d1fae5;color:#065f46}
.stg[data-s="On hold"]{background:#fef3c7;color:#92400e}
.stg[data-s="Lost"]{background:#fee2e2;color:#991b1b}
.stg[data-s="Watching"]{background:#eef1f6;color:#6b7686}
.stg[data-s="Registered"]{background:#e6edf7;color:#2a4a80}
.stg[data-s="PQQ / SQ"]{background:#ece6f7;color:#5b3f9e}
.stg[data-s="ITT received"]{background:#fbf3dc;color:#7A5B14}
.stg[data-s="Submitted"]{background:#dff3f3;color:#0e6b73}
.stg[data-s="Clarifications"]{background:#fef3c7;color:#92400e}
.stg[data-s="No bid"]{background:#eef1f6;color:#6b7686}

/* board */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.col{flex:0 0 230px;background:#eef1f6;border-radius:10px;padding:8px}
.col h3{font-size:12px;color:var(--navy);display:flex;justify-content:space-between;padding:4px 4px 8px}
.col h3 small{color:var(--mut);font-weight:400}
.col .opp{padding:9px 10px;margin-bottom:8px}
.col .opp .co{font-size:13.5px}.col .opp .next{flex-direction:column;gap:2px}

/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.1}
.kpi .s{font-size:11px;color:var(--mut);margin-top:3px}
.kpi.warn .v{color:var(--red)}.kpi.good .v{color:var(--green)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:12px}
.bar .t{height:16px;background:#eef1f6;border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--steel);border-radius:4px}
.bar .n{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.rep2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.rep2{grid-template-columns:1fr}}
.att{list-style:none}
.att li{padding:8px 0;border-bottom:1px solid #eef1f6;font-size:13px;display:flex;gap:8px;align-items:baseline;cursor:pointer}
.att li:last-child{border-bottom:none}
.att li .who{font-size:11px;color:var(--mut);white-space:nowrap;margin-left:auto}

/* sheet / modal */
.ov{position:fixed;inset:0;height:100svh;background:rgba(15,25,45,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center;padding:20px}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:calc(100svh - 20px);border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:700px){.sheet{border-radius:14px;max-height:90vh}}
.sheet .sh{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.sheet .sh h2{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sheet .sh .mx{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;opacity:.8;line-height:1}
.sheet .sb{overflow-y:auto;padding:12px 14px calc(16px + var(--sab));-webkit-overflow-scrolling:touch}
.sheet .sf{background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--sab));display:flex;gap:8px;flex-wrap:wrap}
.sheet .sf .btn{flex:1}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:9px 12px;border-bottom:1px solid #eef1f6;display:flex;align-items:center}
.sec h3 .r{margin-left:auto}
.sec .b{padding:10px 12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px;font-size:13px}
.kv div b{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.kv div span{display:block;margin-top:1px;word-break:break-word}
.kv .wide{grid-column:1/-1}
.contact{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f6;font-size:13px}
.contact:last-child{border-bottom:none}
.contact .nm{font-weight:700}.contact .rl{color:var(--mut);font-size:12px}
.contact .acts{margin-left:auto;display:flex;gap:6px}
.contact .acts a,.contact .acts button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#e8ecf3;color:var(--navy);text-decoration:none;font-size:15px;border:none;cursor:pointer}
.tl{list-style:none}
.tl li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #eef1f6}
.tl li:last-child{border-bottom:none}
.tl .ic{width:30px;height:30px;border-radius:50%;background:#e8ecf3;display:flex;align-items:center;justify-content:center;font-size:14px}
.tl .hd{font-size:11.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
.tl .hd b{color:var(--navy)}
.tl .nt{font-size:13.5px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.tl .nx{font-size:12px;color:var(--amber);margin-top:3px}
.fab{position:fixed;right:16px;bottom:calc(16px + var(--sab));background:var(--gold);color:#22262e;border:none;border-radius:28px;padding:14px 20px;font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;z-index:60}
.empty{padding:30px 10px;text-align:center;color:var(--mut);font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--sab));background:#22262e;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.pin{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.pin input{font-family:Consolas,monospace;font-size:26px;letter-spacing:12px;text-align:center;width:180px;border:1px solid var(--line);border-radius:8px;padding:10px}
.pin .msg{font-size:12px;color:var(--red);min-height:16px}
.muted{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
code{font-family:Consolas,monospace;font-size:12.5px;background:#eef1f6;padding:1px 5px;border-radius:4px}
.help{font-size:12.5px;line-height:1.5}
.help ol{padding-left:18px}.help li{margin:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:#f7f9fc;text-align:left;padding:7px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid #eef1f6;vertical-align:top}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr{cursor:pointer}.tbl tr:hover td{background:#f2f6fc}
.hideM{display:initial}@media(max-width:700px){.hideM{display:none!important}}
.onlyM{display:none}@media(max-width:700px){.onlyM{display:initial}}
</style>
</head>
<body>
<header>
  <img id="logo" alt="Tibard">
  <h1>Sales <span>Pipeline</span></h1>
  <div class="spacer"></div>
  <div class="sync" id="sync"><i class="local"></i><span id="syncTxt">local</span></div>
  <div class="userchip" id="userChip" style="display:none"></div>
  <button class="ibtn" id="refreshBtn" title="Refresh">&#8635;</button>
  <button class="ibtn" id="settingsBtn" title="Settings">&#9881;</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div id="ovRoot"></div>
<div class="toast" id="toast"></div>

/* ---------- SHA-256 (sync, works on file:// too) ---------- */
function sha256(ascii){
  function rr(v, a){ return (v >>> a) | (v << (32 - a)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), i, j, result = '';
  var words = [], asciiBitLength = ascii.length * 8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k.length;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); if (j >> 8) return; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((asciiBitLength / maxWord) | 0); words[words.length] = (asciiBitLength);
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), oldHash = hash; hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var temp1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      var temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash); hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? 0 : '') + b.toString(16); }
  return result;
}

/* ---------- GitHub Contents API ---------- */
var GH = {
  url: function(path){ return 'https://api.github.com/repos/' + S.repo + '/contents/' + path + '?ref=' + encodeURIComponent(S.branch) + '&_=' + Date.now(); },
  headers: function(){ return { 'Authorization': 'Bearer ' + S.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; },
  b64dec: function(b64){ var bin = atob(b64.replace(/\n/g, '')); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); },
  b64enc: function(str){ var bytes = new TextEncoder().encode(str); var bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); },
  get: function(path){
    return fetch(GH.url(path), { headers: GH.headers(), cache: 'no-store' }).then(function(r){
      if (r.status === 404) return { missing: true };
      if (!r.ok) return r.text().then(function(t){ throw new Error('GitHub ' + r.status + ' reading ' + path + (r.status === 401 ? ' — token invalid or expired' : r.status === 403 ? ' — token has no access to ' + S.repo : '')); });
      return r.json().then(function(j){
        if (j.content) return { sha: j.sha, json: JSON.parse(GH.b64dec(j.content)) };
        // >1MB: fetch blob
        return fetch('https://api.github.com/repos/' + S.repo + '/git/blobs/' + j.sha, { headers: GH.headers(), cache: 'no-store' }).then(function(b){ return b.json(); }).then(function(b){ return { sha: j.sha, json: JSON.parse(GH.b64dec(b.content)) }; });
      });
    });
  },
  put: function(path, obj, sha, msg){
    var body = { message: msg || ('Update ' + path), content: GH.b64enc(JSON.stringify(obj, null, 1)), branch: S.branch };
    if (sha) body.sha = sha;
    return fetch('https://api.github.com/repos/' + S.repo + '/contents/' + path, { method: 'PUT', headers: GH.headers(), body: JSON.stringify(body) }).then(function(r){
      if (r.status === 409 || r.status === 422) { var e = new Error('conflict'); e.conflict = true; throw e; }
      if (!r.ok) return r.text().then(function(t){ throw new Error('GitHub ' + r.status + ' saving ' + path + (r.status === 403 || r.status === 401 ? ' — token cannot write to ' + S.repo : '') ); });
      return r.json();
    }).then(function(j){ return j.content.sha; });
  }
};

  }

}
function writeFile(path, obj, msg){

    return GH.put(path, obj, S.shas[path], msg).then(function(sha){ S.shas[path] = sha; delete S.missing[path]; });
  }
  LS.set('file.' + path, JSON.stringify(obj));

}

/* merge a remote copy into local (record-level, newest updatedAt wins; activities union) */
function mergeRep(local, remote){
  ['accounts', 'contacts', 'opportunities', 'tenders'].forEach(function(c){
    if (!remote[c]) return; local[c] = local[c] || [];
    var byId = {}; local[c].forEach(function(r){ byId[r.id] = r; });
    remote[c].forEach(function(r){ var l = byId[r.id]; if (!l) local[c].push(r); else if ((r.updatedAt || '') > (l.updatedAt || '')) Object.assign(l, r); });
  });
  if (remote.activities) { var ids = {}; (local.activities = local.activities || []).forEach(function(a){ ids[a.id] = 1; }); remote.activities.forEach(function(a){ if (!ids[a.id]) local.activities.push(a); }); }
  return local;
}

function pathFor(key){ if (key === 'tenders') return DEFAULTS.TENDERS_PATH; if (key === 'config') return DEFAULTS.CONFIG_PATH; var u = userByKey(key); return u && u.file; }

var saveQ = Promise.resolve();
function save(key, msg){
  var path = pathFor(key);
  saveQ = saveQ.then(function(){
    setSync('busy', 'saving…');
    var attempt = function(n){
      return writeFile(path, objFor(key), msg).catch(function(e){
        if (e.conflict && n < 3) {
          return GH.get(path).then(function(r){ if (!r.missing) { S.shas[path] = r.sha; mergeRep(objFor(key), r.json); } return attempt(n + 1); });
        }
        throw e;
      });
    };
    return attempt(0).then(function(){ setSync(S.mode === 'github' ? 'ok' : 'local', S.mode === 'github' ? 'saved ' + new Date().toTimeString().slice(0, 5) : 'local only'); toast('Saved'); })
      .catch(function(e){ setSync('err', 'save failed'); S.error = e.message; render(); alert('Save failed: ' + e.message); });
  });
  return saveQ;
}

function loadAll(){

function periodRange(p){

    if (!o.imported && (o.createdAt || '') >= from) k.newOpps++;
    if (isOpen(o) && o.nextActionDue) { var n = daysUntil(o.nextActionDue); if (n < 0) k.overdue++; if (o.nextActionDue <= we) k.dueWeek++; }
    if (isActive(o)) { var last = o.lastActivityAt || o.updatedAt || o.createdAt; if (last && (Date.now() - new Date(last).getTime()) / 86400000 > stale) k.stale++; }
  });
  rep.activities.forEach(function(a){
    if ((a.at || '') < from || a.source) return;
    k.acts++;
    var t = a.type; if (t === 'Call') k.calls++; else if (t === 'Meeting') k.meetings++; else if (t === 'Quote') k.quotes++; else if (t === 'Samples') k.samples++; else if (t === 'Email') k.emails++;
  });
  if (k.wonAll + k.lostAll) k.winRate = Math.round(100 * k.wonAll / (k.wonAll + k.lostAll));
  return k;
}

      tile('Quotes / samples', k.quotes + ' / ' + k.samples, pl[p]) +
      tile('Overdue actions', k.overdue, k.dueWeek + ' due this week', k.overdue ? 'warn' : '') +

    stages.map(function(s){ return '<div class="bar"><span class="stg" data-s="' + h(s) + '">' + h(s) + '</span><div class="t"><i style="width:' + Math.round(100 * counts[s] / max) + '%"></i></div><span class="n">' + counts[s] + ' · ' + moneyK(vals[s]) + '</span></div>'; }).join('') + '</div></div>';

  // needs attention

    var o = x.o; if (!isOpen(o)) return;

  });
  att.sort(by('sort'));
  var staleList = [];
  allOpps().forEach(function(x){ var o = x.o; if (!isActive(o)) return; var last = o.lastActivityAt || o.updatedAt; var d = (Date.now() - new Date(last).getTime()) / 86400000; if (d > (S.cfg.staleDays || 30)) staleList.push({ t: Math.floor(d) + 'd quiet', s: x.acc.name + ' · ' + o.stage, who: x.rep.owner.split(' ')[0], cls: 'soon', open: 'openOpp(\'' + x.repKey + '\',\'' + o.id + '\')', sort: -d }); });
  staleList.sort(by('sort'));
  var tend = (S.tenders ? S.tenders.tenders : []).filter(function(t){ return t.submissionDeadline && ['Won', 'Lost', 'No bid'].indexOf(t.stage) < 0 && daysUntil(t.submissionDeadline) <= 21; }).map(function(t){ var n = daysUntil(t.submissionDeadline); return { t: n < 0 ? 'Deadline passed' : 'Deadline in ' + n + 'd', s: t.title + ' · ' + t.issuer, who: 'Tender', cls: n <= 7 ? 'over' : 'soon', open: 'openTender(\'' + t.id + '\')' }; });

  html += '<div class="rep2">';

  html += '<div class="card"><h2>Gone quiet <span class="r">' + staleList.length + '</span></h2><div class="body">' + (staleList.length ? '<ul class="att">' + staleList.slice(0, 12).map(attLi).join('') + '</ul>' : '<div class="empty">Everything active has been touched in the last ' + (S.cfg.staleDays || 30) + ' days</div>') + '</div></div>';
  html += '</div>';

  // top weighted
  var top = allOpps().filter(function(x){ return isActive(x.o) && x.o.annualValue; }).sort(function(a, b){ return weighted(b.o) - weighted(a.o); }).slice(0, 10);
  html += '<div class="card"><h2>Top opportunities <span class="r">by weighted annual value</span></h2><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Company</th><th class="hideM">Owner</th><th>Stage</th><th class="num hideM">%</th><th class="num">Annual</th><th class="num">Weighted</th><th class="hideM">Expected</th></tr></thead><tbody>' +
    top.map(function(x){ return '<tr onclick="openOpp(\'' + x.repKey + '\',\'' + x.o.id + '\')"><td><b>' + h(x.acc.name) + '</b></td><td class="hideM">' + h(x.rep.owner.split(' ')[0]) + '</td><td><span class="stg" data-s="' + h(x.o.stage) + '">' + h(x.o.stage) + '</span></td><td class="num hideM">' + (x.o.probability || 0) + '%</td><td class="num">' + money(x.o.annualValue) + '</td><td class="num"><b>' + money(weighted(x.o)) + '</b><small class="onlyM" style="display:block;color:var(--mut)">' + (x.o.probability || 0) + '%</small></td><td class="hideM">' + h(x.o.expectedStart || '—') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';

  // recent activity

  feed.sort(function(a, b){ return (b.a.at || '').localeCompare(a.a.at || ''); });
  html += '<div class="card"><h2>Recent activity</h2><div class="body">' + (feed.length ? '<ul class="tl">' + feed.slice(0, 12).map(function(f){ var acc = accOf(f.rep, f.a.accountId); return '<li onclick="openOpp(\'' + f.repKey + '\',\'' + f.a.oppId + '\')" style="cursor:pointer"><div class="ic">' + (ICONS[f.a.type] || '📝') + '</div><div><div class="hd"><b>' + h(acc.name) + '</b> ' + h(f.a.type) + ' · ' + h(f.a.by) + ' · ' + fmtDT(f.a.at) + '</div><div class="nt">' + h((f.a.note || '').slice(0, 160)) + '</div></div></li>'; }).join('') + '</ul>' : '<div class="empty">No activity logged yet</div>') + '</div></div>';
  return html;
}
function tile(l, v, s, cls){ return '<div class="kpi ' + (cls || '') + '"><div class="l">' + h(l) + '</div><div class="v">' + h(v) + '</div>' + (s ? '<div class="s">' + h(s) + '</div>' : '') + '</div>'; }

/* ---------- rep pipeline ---------- */
function renderRep(key){
  var rep = S.data[key], u = userByKey(key), f = S.filters[key] || (S.filters[key] = { q: '', stage: 'open', sort: 'next', view: 'list' });
  var html = '';
  if (!canEdit(key)) html += '<div class="banner">Viewing ' + h(u.name) + '\'s pipeline (read only). ' + (S.user ? '' : '<span class="lnk" onclick="openPin()">Enter PIN to edit</span>') + '</div>';
  html += '<div class="toolbar"><input type="search" placeholder="Search company, contact, notes…" value="' + h(f.q) + '" oninput="S.filters[\'' + key + '\'].q=this.value;render()">' +
    '<select onchange="S.filters[\'' + key + '\'].stage=this.value;render()">' + [['open', 'Open (not won/lost)'], ['active', 'Active (excl. on hold)'], ['week', 'Due this week / overdue'], ['all', 'All']].concat(S.cfg.stages.map(function(s){ return [s, s]; })).map(function(o){ return '<option value="' + h(o[0]) + '"' + (f.stage === o[0] ? ' selected' : '') + '>' + h(o[1]) + '</option>'; }).join('') + '</select>' +
    '<select onchange="S.filters[\'' + key + '\'].sort=this.value;render()">' + [['next', 'Next action'], ['value', 'Annual value'], ['weighted', 'Weighted'], ['updated', 'Last updated'], ['name', 'Company A–Z']].map(function(o){ return '<option value="' + o[0] + '"' + (f.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
    '<button class="btn btn-sm hideM" onclick="S.filters[\'' + key + '\'].view=\'' + (f.view === 'list' ? 'board' : 'list') + '\';render()">' + (f.view === 'list' ? 'Board view' : 'List view') + '</button></div>';

  var q = f.q.toLowerCase(), we = weekEnd();
  var rows = rep.opportunities.map(function(o){ return { o: o, acc: accOf(rep, o.accountId), cs: contactsOf(rep, o.accountId) }; }).filter(function(x){
    var o = x.o;
    if (f.stage === 'open' && !isOpen(o)) return false;
    if (f.stage === 'active' && !isActive(o)) return false;
    if (f.stage === 'week' && !(isOpen(o) && o.nextActionDue && o.nextActionDue <= we)) return false;
    if (S.cfg.stages.indexOf(f.stage) >= 0 && o.stage !== f.stage) return false;
    if (q) { var blob = [x.acc.name, x.acc.location, x.acc.sector, x.acc.sageCode, x.acc.brief, o.nextAction, o.title].concat(x.cs.map(function(c){ return c.name + ' ' + c.role; })).join(' ').toLowerCase(); var notes = rep.activities.filter(function(a){ return a.oppId === o.id; }).map(function(a){ return a.note; }).join(' ').toLowerCase(); if (blob.indexOf(q) < 0 && notes.indexOf(q) < 0) return false; }
    return true;
  });
  var sorters = { next: function(a, b){ var x = a.o.nextActionDue, y = b.o.nextActionDue; if (x && y) return x.localeCompare(y); if (x) return -1; if (y) return 1; return (b.o.updatedAt || '').localeCompare(a.o.updatedAt || ''); }, value: function(a, b){ return (b.o.annualValue || 0) - (a.o.annualValue || 0); }, weighted: function(a, b){ return weighted(b.o) - weighted(a.o); }, updated: function(a, b){ return (b.o.updatedAt || '').localeCompare(a.o.updatedAt || ''); }, name: function(a, b){ return a.acc.name.localeCompare(b.acc.name); } };
  rows.sort(sorters[f.sort] || sorters.next);

  var tot = rows.reduce(function(s, x){ return s + (x.o.annualValue || 0); }, 0), wtd = rows.reduce(function(s, x){ return s + weighted(x.o); }, 0);
  html += '<div class="muted" style="margin-bottom:8px">' + rows.length + ' opportunities · ' + moneyK(tot) + ' annual · ' + moneyK(wtd) + ' weighted</div>';
  if (!rows.length) html += '<div class="empty">No opportunities match.' + (canEdit(key) ? ' Tap <b>+ New opportunity</b> to add one.' : '') + '</div>';
  else if (f.view === 'board' && window.innerWidth > 700) {
    html += '<div class="board">' + S.cfg.stages.map(function(s){ var cs = rows.filter(function(x){ return x.o.stage === s; }); if (!cs.length && ['Lost', 'Lead', 'Won'].indexOf(s) >= 0) return ''; return '<div class="col"><h3>' + h(s) + ' <small>' + cs.length + ' · ' + moneyK(cs.reduce(function(a, x){ return a + (x.o.annualValue || 0); }, 0)) + '</small></h3>' + cs.map(function(x){ return oppCard(key, x, true); }).join('') + '</div>'; }).join('') + '</div>';
  } else html += '<div class="olist">' + rows.map(function(x){ return oppCard(key, x); }).join('') + '</div>';
  return html;
}

    '<div class="val">' + (o.annualValue ? money(o.annualValue) : '<span class="muted">TBA</span>') + '<small>' + (o.probability != null ? o.probability + '% · ' + moneyK(weighted(o)) : '') + '</small></div>' +

/* form helpers */
function fld(label, name, value, type, opts){
  opts = opts || {};
  var cls = 'field' + (opts.span ? ' span2' : '') + (opts.mspan ? ' mspan' : '');
  var inner;
  if (type === 'select') inner = '<select data-f="' + name + '">' + (opts.blank ? '<option value="">' + h(opts.blank) + '</option>' : '') + opts.options.map(function(o){ var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o; return '<option value="' + h(v) + '"' + (String(value) === String(v) ? ' selected' : '') + '>' + h(l) + '</option>'; }).join('') + '</select>';
  else if (type === 'textarea') inner = '<textarea data-f="' + name + '" placeholder="' + h(opts.ph || '') + '">' + h(value || '') + '</textarea>';
  else inner = '<input data-f="' + name + '" type="' + (type || 'text') + '" value="' + h(value == null ? '' : value) + '" placeholder="' + h(opts.ph || '') + '"' + (opts.list ? ' list="' + opts.list + '"' : '') + (type === 'number' ? ' inputmode="decimal"' : '') + (opts.attrs || '') + '>';
  return '<div class="' + cls + '"><label>' + h(label) + '</label>' + inner + '</div>';
}
function readForm(root){ var out = {}; (root || $('sb')).querySelectorAll('[data-f]').forEach(function(el){ out[el.getAttribute('data-f')] = el.value; }); return out; }

/* ---------- PIN ---------- */
function openPin(next){
  openSheet('Enter your PIN', '<div class="pin"><div class="muted">Your PIN identifies you and unlocks your area for editing.</div><input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"><div class="msg" id="pinMsg"></div><button class="btn btn-gold" onclick="submitPin()">Unlock</button></div>');
  S._pinNext = next || null;
  setTimeout(function(){ var i = $('pinIn'); if (i) i.focus(); }, 50);
  $('pinIn').addEventListener('keydown', function(e){ if (e.key === 'Enter') submitPin(); });
}
function submitPin(){
  var v = $('pinIn').value;
  if (tryPin(v)) { closeSheet(); toast('Unlocked as ' + S.user.name); render(); if (S._pinNext) S._pinNext(); }
  else { $('pinMsg').textContent = 'PIN not recognised'; $('pinIn').select(); }
}

/* ---------- opportunity detail ---------- */
function openOpp(key, id){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0];
  if (!o) return;
  var acc = accOf(rep, o.accountId), cs = contactsOf(rep, o.accountId), acts = actsOf(rep, o.id), ed = canEdit(key);
  var body = '';
  body += '<div class="row" style="margin-bottom:10px;justify-content:space-between"><span class="stg" data-s="' + h(o.stage) + '" style="font-size:12px;padding:4px 10px">' + h(o.stage) + '</span><span class="muted">' + h(rep.owner) + ' · updated ' + rel(o.updatedAt) + (o.updatedBy ? ' by ' + h(o.updatedBy.split(' ')[0]) : '') + '</span></div>';
  // deal
  body += '<div class="sec"><h3>Opportunity' + (ed ? '<span class="r"><button class="btn btn-sm" onclick="editDeal(\'' + key + '\',\'' + id + '\')">Edit</button></span>' : '') + '</h3><div class="b"><div class="kv">' +
    kv('Title', o.title) + kv('1st order value', money(o.firstOrderValue)) + kv('Annual value', money(o.annualValue)) + kv('% chance', o.probability != null ? o.probability + '%' : '—') + kv('Weighted', money(weighted(o))) + kv('Expected start', o.expectedStart || '—') +
    (o.stage === 'Won' ? kv('Won on', fmtDate(o.wonDate)) : '') + (o.stage === 'Lost' ? kv('Lost reason', o.lostReason || '—') : '') + (o.stage === 'On hold' ? kv('Revisit', fmtDate(o.holdUntil || o.nextActionDue)) : '') +
    '<div class="wide"><b>Next action</b><span><span class="due ' + dueClass(o.nextActionDue) + '" style="font-weight:700">' + (o.nextActionDue ? fmtDate(o.nextActionDue) + ' (' + dueLabel(o.nextActionDue) + ')' : 'no date') + '</span> — ' + h(o.nextAction || '—') + '</span></div>' +
    '</div></div></div>';
  // company
  body += '<div class="sec"><h3>Company' + (ed ? '<span class="r"><button class="btn btn-sm" onclick="editAccount(\'' + key + '\',\'' + id + '\')">Edit</button></span>' : '') + '</h3><div class="b"><div class="kv">' +
    kv('Company', acc.name) + kv('Location', acc.location) + kv('Sector', acc.sector) + kv('Type', acc.type) + kv('Staff', acc.staff != null ? acc.staff.toLocaleString('en-GB') : '—') + kv('Sage account', acc.sageCode ? '<code>' + h(acc.sageCode) + '</code>' : '—', true) + (acc.website ? kv('Website', '<a href="' + h(/^https?:/.test(acc.website) ? acc.website : 'https://' + acc.website) + '" target="_blank" rel="noopener">' + h(acc.website) + '</a>', true) : '') +
    (acc.brief ? '<div class="wide"><b>Brief</b><span>' + h(acc.brief) + '</span></div>' : '') + '</div></div></div>';
  // contacts
  body += '<div class="sec"><h3>Contacts' + (ed ? '<span class="r"><button class="btn btn-sm" onclick="editContact(\'' + key + '\',\'' + id + '\',\'\')">+ Add</button></span>' : '') + '</h3><div class="b">' +
    (cs.length ? cs.map(function(c){ return '<div class="contact"><div><div class="nm">' + h(c.name) + (c.primary ? ' <span class="stg">main</span>' : '') + '</div><div class="rl">' + h(c.role || '') + (c.email ? ' · ' + h(c.email) : '') + (c.phone ? ' · ' + h(c.phone) : '') + '</div></div><div class="acts">' + (c.phone ? '<a href="tel:' + h(c.phone) + '" title="Call">📞</a>' : '') + (c.email ? '<a href="mailto:' + h(c.email) + '" title="Email">✉️</a>' : '') + (ed ? '<button onclick="editContact(\'' + key + '\',\'' + id + '\',\'' + c.id + '\')" title="Edit">✎</button>' : '') + '</div></div>'; }).join('') : '<div class="muted">No contacts yet</div>') + '</div></div>';
  // timeline
  body += '<div class="sec"><h3>Timeline <span class="r muted">' + acts.length + ' entries</span></h3><div class="b">' + (acts.length ? '<ul class="tl">' + acts.map(function(a){ return '<li><div class="ic">' + (ICONS[a.type] || '📝') + '</div><div><div class="hd"><b>' + h(a.type) + '</b><span>' + fmtDT(a.at) + '</span><span>' + h(a.by) + '</span>' + (a.source ? '<span>(' + h(a.source) + ')</span>' : '') + '</div><div class="nt">' + h(a.note) + '</div>' + (a.nextAction ? '<div class="nx">→ ' + h(a.nextAction) + (a.nextActionDue ? ' by ' + fmtDate(a.nextActionDue) : '') + '</div>' : '') + '</div></li>'; }).join('') + '</ul>' : '<div class="muted">No updates yet</div>') + '</div></div>';
  var foot = ed ? '<button class="btn btn-gold" onclick="openUpdate(\'' + key + '\',\'' + id + '\')">+ Add update</button><button class="btn btn-red" style="flex:0 0 auto" onclick="deleteOpp(\'' + key + '\',\'' + id + '\')">Delete</button>' : (S.user ? '' : '<button class="btn" onclick="openPin(function(){openOpp(\'' + key + '\',\'' + id + '\')})">Enter PIN to edit</button>');
  openSheet(h(acc.name), body, foot);
}
function kv(l, v, raw){ return '<div><b>' + h(l) + '</b><span>' + (raw ? v : h(v == null || v === '' ? '—' : v)) + '</span></div>'; }

/* add update (activity + next action + optional stage change) */
function openUpdate(key, id){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0], acc = accOf(rep, o.accountId);
  var types = S.cfg.activityTypes;
  var body = '<div class="field" style="margin-bottom:10px"><label>What happened?</label><div class="chips" id="atype">' + types.map(function(t, i){ return '<span class="chip ' + (i === 0 ? 'on' : '') + '" data-t="' + h(t) + '" onclick="pickChip(this)">' + (ICONS[t] || '') + ' ' + h(t) + '</span>'; }).join('') + '</div></div>' +
    fld('Notes', 'note', '', 'textarea', { ph: 'What was discussed / sent / agreed…' }) +
    '<div class="grid" style="margin-top:10px">' + fld('Next action', 'nextAction', o.nextAction || '', 'text', { span: true, ph: 'e.g. Chase for feedback on boards' }) + fld('Due date', 'nextActionDue', o.nextActionDue || '', 'date') + fld('Stage', 'stage', o.stage, 'select', { options: S.cfg.stages, attrs: ' onchange="stageExtra(this.value)"' }) + '</div>' +
    '<div id="stageExtra" class="grid" style="margin-top:10px"></div>';
  openSheet('Update · ' + h(acc.name), body, '<button class="btn" onclick="openOpp(\'' + key + '\',\'' + id + '\')">Cancel</button><button class="btn btn-gold" onclick="saveUpdate(\'' + key + '\',\'' + id + '\')">Save update</button>', { back: 'openOpp(\'' + key + '\',\'' + id + '\')' });
  stageExtra(o.stage, o, acc);
  setTimeout(function(){ var t = $('sb').querySelector('textarea'); if (t) t.focus(); }, 60);
}
function pickChip(el){ el.parentNode.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); }); el.classList.add('on'); }
function stageExtra(stage, o, acc){
  var el = $('stageExtra'); if (!el) return; o = o || {}; acc = acc || {};
  if (stage === 'Won') el.innerHTML = fld('Won on', 'wonDate', o.wonDate || today(), 'date') + fld('Sage account code', 'sageCode', acc.sageCode || '', 'text', { ph: 'e.g. ASC001' });
  else if (stage === 'Lost') el.innerHTML = fld('Lost reason', 'lostReason', o.lostReason || '', 'text', { span: true, ph: 'Price / incumbent / no budget / no response…' });
  else if (stage === 'On hold') el.innerHTML = fld('Revisit on', 'holdUntil', o.holdUntil || '', 'date');
  else el.innerHTML = '';
}
function saveUpdate(key, id){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0], acc = accOf(rep, o.accountId);
  var f = readForm(), chip = $('atype').querySelector('.chip.on'), type = chip ? chip.getAttribute('data-t') : 'Note';
  if (!f.note.trim() && f.stage === o.stage && f.nextAction === (o.nextAction || '') && f.nextActionDue === (o.nextActionDue || '')) { alert('Add a note or change something first.'); return; }
  var who = S.user.name, at = nowISO(), note = f.note.trim();
  if (f.stage !== o.stage) note = (note ? note + '\n' : '') + 'Stage: ' + o.stage + ' → ' + f.stage;
  rep.activities.push({ id: uid('act'), oppId: o.id, accountId: o.accountId, type: type, note: note, nextAction: f.nextAction, nextActionDue: f.nextActionDue || null, at: at, by: who });
  o.nextAction = f.nextAction; o.nextActionDue = f.nextActionDue || null; o.lastActivityAt = at;
  if (f.stage !== o.stage) { o.stage = f.stage; if (f.stage === 'Won') { o.wonDate = f.wonDate || today(); if (f.sageCode) { acc.sageCode = f.sageCode.trim().toUpperCase(); stamp(acc); } acc.type = 'Existing customer'; } if (f.stage === 'Lost') o.lostReason = f.lostReason || ''; if (f.stage === 'On hold') { o.holdUntil = f.holdUntil || null; if (f.holdUntil && !o.nextActionDue) { o.nextActionDue = f.holdUntil; o.nextAction = o.nextAction || 'Revisit'; } } }
  else if (f.stage === 'Won' && f.sageCode && f.sageCode !== acc.sageCode) { acc.sageCode = f.sageCode.trim().toUpperCase(); stamp(acc); }
  stamp(o);
  save(key, who + ': update ' + acc.name);
  openOpp(key, id); render();
}

/* edit deal fields */
function editDeal(key, id){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0], acc = accOf(rep, o.accountId);
  var body = '<div class="grid">' + fld('Title', 'title', o.title, 'text', { span: true }) + fld('1st order value £', 'firstOrderValue', o.firstOrderValue, 'number') + fld('Annual value £', 'annualValue', o.annualValue, 'number') + fld('% chance', 'probability', o.probability, 'select', { options: [0, 10, 15, 25, 50, 70, 80, 90, 100].map(function(p){ return [p, p + '%']; }), blank: '—' }) + fld('Expected start', 'expectedStart', o.expectedStart, 'text', { ph: 'e.g. Oct 2026 / Q2 2027' }) + fld('Stage', 'stage', o.stage, 'select', { options: S.cfg.stages }) + fld('Next action', 'nextAction', o.nextAction, 'text', { span: true }) + fld('Due date', 'nextActionDue', o.nextActionDue, 'date') + fld('Won on', 'wonDate', o.wonDate, 'date') + fld('Lost reason', 'lostReason', o.lostReason, 'text') + fld('Revisit (on hold)', 'holdUntil', o.holdUntil, 'date') + '</div>';
  openSheet('Edit · ' + h(acc.name), body, '<button class="btn" onclick="openOpp(\'' + key + '\',\'' + id + '\')">Cancel</button><button class="btn btn-gold" onclick="saveDeal(\'' + key + '\',\'' + id + '\')">Save</button>', { back: 'openOpp(\'' + key + '\',\'' + id + '\')' });
}
function saveDeal(key, id){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0], f = readForm(), old = o.stage;
  o.title = f.title.trim() || 'Uniform supply'; o.firstOrderValue = num(f.firstOrderValue); o.annualValue = num(f.annualValue); o.probability = f.probability === '' ? null : +f.probability; o.expectedStart = f.expectedStart.trim(); o.stage = f.stage; o.nextAction = f.nextAction.trim(); o.nextActionDue = f.nextActionDue || null; o.wonDate = f.wonDate || null; o.lostReason = f.lostReason.trim(); o.holdUntil = f.holdUntil || null;
  if (o.stage === 'Won' && !o.wonDate) o.wonDate = today();
  if (old !== o.stage) rep.activities.push({ id: uid('act'), oppId: o.id, accountId: o.accountId, type: 'Note', note: 'Stage: ' + old + ' → ' + o.stage, at: nowISO(), by: S.user.name });
  stamp(o); save(key, S.user.name + ': edit ' + accOf(rep, o.accountId).name); openOpp(key, id); render();
}

/* edit account */
function editAccount(key, id){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0], acc = accOf(rep, o.accountId);
  openSheet('Edit company', accountFields(acc), '<button class="btn" onclick="openOpp(\'' + key + '\',\'' + id + '\')">Cancel</button><button class="btn btn-gold" onclick="saveAccount(\'' + key + '\',\'' + id + '\')">Save</button>', { back: 'openOpp(\'' + key + '\',\'' + id + '\')' });
}
function accountFields(a){
  return '<div class="grid">' + fld('Company', 'name', a.name, 'text', { span: true }) + fld('Location', 'location', a.location) + fld('Sector', 'sector', a.sector, 'select', { options: S.cfg.sectors, blank: '—' }) + fld('Type', 'type', a.type || 'New business', 'select', { options: ['New business', 'Existing customer'] }) + fld('No. of staff', 'staff', a.staff, 'number') + fld('Sage account code', 'sageCode', a.sageCode, 'text', { ph: 'e.g. ASC001' }) + fld('Website', 'website', a.website, 'text', { ph: 'www…' }) + fld('Brief / narrative', 'brief', a.brief, 'textarea', { span: true, ph: 'Sites, departments, what they are looking for…' }) + '</div>';
}
function saveAccount(key, id){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0], acc = accOf(rep, o.accountId), f = readForm();
  if (!f.name.trim()) { alert('Company name is required'); return; }
  acc.name = f.name.trim(); acc.location = f.location.trim(); acc.sector = f.sector; acc.type = f.type; acc.staff = num(f.staff); acc.sageCode = f.sageCode.trim().toUpperCase(); acc.website = f.website.trim(); acc.brief = f.brief.trim();
  stamp(acc); save(key, S.user.name + ': edit company ' + acc.name); openOpp(key, id); render();
}

/* edit / add contact */
function editContact(key, id, cid){
  var rep = S.data[key], c = cid ? rep.contacts.filter(function(x){ return x.id === cid; })[0] : { name: '', role: '', phone: '', email: '', primary: false };
  var body = '<div class="grid">' + fld('Name', 'name', c.name, 'text', { span: true }) + fld('Role / job title', 'role', c.role, 'text', { span: true }) + fld('Phone', 'phone', c.phone, 'tel') + fld('Email', 'email', c.email, 'email') + fld('Main contact?', 'primary', c.primary ? 'yes' : 'no', 'select', { options: [['yes', 'Yes'], ['no', 'No']] }) + '</div>';
  openSheet(cid ? 'Edit contact' : 'Add contact', body, '<button class="btn" onclick="openOpp(\'' + key + '\',\'' + id + '\')">Cancel</button>' + (cid ? '<button class="btn btn-red" style="flex:0 0 auto" onclick="deleteContact(\'' + key + '\',\'' + id + '\',\'' + cid + '\')">Delete</button>' : '') + '<button class="btn btn-gold" onclick="saveContact(\'' + key + '\',\'' + id + '\',\'' + (cid || '') + '\')">Save</button>', { back: 'openOpp(\'' + key + '\',\'' + id + '\')' });
}
function saveContact(key, id, cid){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0], f = readForm();
  if (!f.name.trim()) { alert('Name is required'); return; }
  var c = cid ? rep.contacts.filter(function(x){ return x.id === cid; })[0] : null;
  if (!c) { c = stamp({ id: uid('con'), accountId: o.accountId }, true); rep.contacts.push(c); }
  c.name = f.name.trim(); c.role = f.role.trim(); c.phone = f.phone.trim(); c.email = f.email.trim(); c.primary = f.primary === 'yes';
  if (c.primary) rep.contacts.forEach(function(x){ if (x.accountId === c.accountId && x !== c) x.primary = false; });
  stamp(c); save(key, S.user.name + ': contact ' + c.name); openOpp(key, id); render();
}
function deleteContact(key, id, cid){ if (!confirm('Delete this contact?')) return; var rep = S.data[key]; rep.contacts = rep.contacts.filter(function(x){ return x.id !== cid; }); save(key, S.user.name + ': delete contact'); openOpp(key, id); }
function deleteOpp(key, id){
  var rep = S.data[key], o = rep.opportunities.filter(function(x){ return x.id === id; })[0], acc = accOf(rep, o.accountId);
  if (!confirm('Delete the opportunity for ' + acc.name + '? The company and contacts are kept if other opportunities exist, otherwise removed too.')) return;
  rep.opportunities = rep.opportunities.filter(function(x){ return x.id !== id; });
  rep.activities = rep.activities.filter(function(a){ return a.oppId !== id; });
  if (!oppsOf(rep, acc.id).length) { rep.accounts = rep.accounts.filter(function(a){ return a.id !== acc.id; }); rep.contacts = rep.contacts.filter(function(c){ return c.accountId !== acc.id; }); }
  save(key, S.user.name + ': delete ' + acc.name); closeSheet(); render();
}

/* new opportunity */
function openNewOpp(key){
  var rep = S.data[key];
  var body = '<datalist id="accList">' + rep.accounts.map(function(a){ return '<option value="' + h(a.name) + '">'; }).join('') + '</datalist>' +
    '<div class="sec"><h3>Company</h3><div class="b">' + accountFields({ type: 'New business' }).replace('data-f="name"', 'data-f="name" list="accList" autocomplete="off"') + '<div class="muted" style="margin-top:6px">Typing an existing company name links the new opportunity to it.</div></div></div>' +
    '<div class="sec"><h3>Main contact</h3><div class="b"><div class="grid">' + fld('Name', 'cname', '', 'text') + fld('Role', 'crole', '') + fld('Phone', 'cphone', '', 'tel') + fld('Email', 'cemail', '', 'email') + '</div></div></div>' +
    '<div class="sec"><h3>Opportunity</h3><div class="b"><div class="grid">' + fld('Title', 'title', 'Uniform supply', 'text', { span: true }) + fld('Stage', 'stage', 'Lead', 'select', { options: S.cfg.stages.filter(function(s){ return ['Won', 'Lost'].indexOf(s) < 0; }) }) + fld('% chance', 'probability', 25, 'select', { options: [0, 10, 15, 25, 50, 70, 80, 90, 100].map(function(p){ return [p, p + '%']; }) }) + fld('1st order value £', 'firstOrderValue', '', 'number') + fld('Annual value £', 'annualValue', '', 'number') + fld('Expected start', 'expectedStart', '', 'text', { ph: 'e.g. Jan 2027' }) + fld('Next action', 'nextAction', '', 'text', { span: true }) + fld('Due date', 'nextActionDue', '', 'date') + fld('First note', 'note', '', 'textarea', { span: true, ph: 'How did this come about? What do they need?' }) + '</div></div></div>';
  openSheet('New opportunity · ' + h(rep.owner.split(' ')[0]), body, '<button class="btn" onclick="closeSheet()">Cancel</button><button class="btn btn-gold" onclick="saveNewOpp(\'' + key + '\')">Create</button>');
  setTimeout(function(){ var i = $('sb').querySelector('[data-f=name]'); if (i) i.focus(); }, 60);
}
function saveNewOpp(key){
  var rep = S.data[key], f = readForm(), who = S.user.name, at = nowISO();
  if (!f.name.trim()) { alert('Company name is required'); return; }
  var acc = rep.accounts.filter(function(a){ return a.name.toLowerCase() === f.name.trim().toLowerCase(); })[0];
  if (!acc) { acc = stamp({ id: uid('acc'), name: f.name.trim(), location: f.location.trim(), sector: f.sector, type: f.type, staff: num(f.staff), sageCode: f.sageCode.trim().toUpperCase(), website: f.website.trim(), brief: f.brief.trim() }, true); rep.accounts.push(acc); }
  else { ['location', 'sector', 'website', 'brief'].forEach(function(k){ if (f[k] && f[k].trim()) acc[k] = f[k].trim(); }); if (num(f.staff)) acc.staff = num(f.staff); if (f.sageCode.trim()) acc.sageCode = f.sageCode.trim().toUpperCase(); stamp(acc); }
  if (f.cname.trim()) { var c = stamp({ id: uid('con'), accountId: acc.id, name: f.cname.trim(), role: f.crole.trim(), phone: f.cphone.trim(), email: f.cemail.trim(), primary: !contactsOf(rep, acc.id).length }, true); rep.contacts.push(c); }
  var o = stamp({ id: uid('opp'), accountId: acc.id, title: f.title.trim() || 'Uniform supply', stage: f.stage, probability: +f.probability, firstOrderValue: num(f.firstOrderValue), annualValue: num(f.annualValue), expectedStart: f.expectedStart.trim(), nextAction: f.nextAction.trim(), nextActionDue: f.nextActionDue || null, wonDate: null, lostReason: '', holdUntil: null, lastActivityAt: at }, true);
  rep.opportunities.push(o);
  rep.activities.push({ id: uid('act'), oppId: o.id, accountId: acc.id, type: 'Note', note: f.note.trim() || 'Opportunity created', nextAction: o.nextAction, nextActionDue: o.nextActionDue, at: at, by: who });
  save(key, who + ': new opportunity ' + acc.name); openOpp(key, o.id); render();
}

    fld('Est. annual value £', 'estValue', t.estValue, 'number') + fld('Incumbent', 'incumbent', t.incumbent) + fld('Next action', 'nextAction', t.nextAction, 'text', { span: true }) + fld('Notes', 'notes', t.notes, 'textarea', { span: true }) + '</div>';
}
function openNewTender(){ openSheet('New tender', tenderFields({}), '<button class="btn" onclick="closeSheet()">Cancel</button><button class="btn btn-gold" onclick="saveTender(\'\')">Create</button>'); }
function openTender(id){
  var T = S.tenders, t = T.tenders.filter(function(x){ return x.id === id; })[0]; if (!t) return;
  var ed = canEdit('tenders'), acts = T.activities.filter(function(a){ return a.tenderId === id; }).sort(by('at', 'desc'));
  var body = '<div class="row" style="margin-bottom:10px;justify-content:space-between"><span class="stg" data-s="' + h(t.stage) + '" style="font-size:12px;padding:4px 10px">' + h(t.stage) + '</span><span class="muted">updated ' + rel(t.updatedAt) + (t.updatedBy ? ' by ' + h(t.updatedBy.split(' ')[0]) : '') + '</span></div>' +
    '<div class="sec"><h3>Details' + (ed ? '<span class="r"><button class="btn btn-sm" onclick="editTender(\'' + id + '\')">Edit</button></span>' : '') + '</h3><div class="b"><div class="kv">' + kv('Issuer', t.issuer) + kv('Sector', t.sector) + kv('Owner', t.owner) + kv('Portal / ref', t.portal) + kv('Published', fmtDate(t.published)) + kv('Clarifications by', fmtDate(t.clarificationDeadline)) + '<div><b>Submission deadline</b><span class="due ' + dueClass(t.submissionDeadline) + '" style="font-weight:700">' + (t.submissionDeadline ? fmtDate(t.submissionDeadline) + ' (' + dueLabel(t.submissionDeadline) + ')' : '—') + '</span></div>' + kv('Award expected', fmtDate(t.awardDate)) + kv('Contract start', fmtDate(t.contractStart)) + kv('Contract length', t.contractLength) + kv('Est. annual value', money(t.estValue)) + kv('Incumbent', t.incumbent) + '<div class="wide"><b>Next action</b><span>' + h(t.nextAction || '—') + '</span></div>' + (t.notes ? '<div class="wide"><b>Notes</b><span style="white-space:pre-wrap">' + h(t.notes) + '</span></div>' : '') + '</div></div></div>' +
    '<div class="sec"><h3>Timeline</h3><div class="b">' + (acts.length ? '<ul class="tl">' + acts.map(function(a){ return '<li><div class="ic">' + (ICONS[a.type] || '📄') + '</div><div><div class="hd"><b>' + h(a.type) + '</b><span>' + fmtDT(a.at) + '</span><span>' + h(a.by) + '</span></div><div class="nt">' + h(a.note) + '</div></div></li>'; }).join('') + '</ul>' : '<div class="muted">No updates yet</div>') + '</div></div>';
  openSheet(h(t.title), body, ed ? '<button class="btn btn-gold" onclick="openTenderUpdate(\'' + id + '\')">+ Add update</button><button class="btn btn-red" style="flex:0 0 auto" onclick="deleteTender(\'' + id + '\')">Delete</button>' : (S.user ? '' : '<button class="btn" onclick="openPin(function(){openTender(\'' + id + '\')})">Enter PIN to edit</button>'));
}
function editTender(id){ var t = S.tenders.tenders.filter(function(x){ return x.id === id; })[0]; openSheet('Edit tender', tenderFields(t), '<button class="btn" onclick="openTender(\'' + id + '\')">Cancel</button><button class="btn btn-gold" onclick="saveTender(\'' + id + '\')">Save</button>', { back: 'openTender(\'' + id + '\')' }); }
function saveTender(id){
  var T = S.tenders, f = readForm(); if (!f.title.trim()) { alert('Title is required'); return; }
  var t = id ? T.tenders.filter(function(x){ return x.id === id; })[0] : null, isNew = !t, old = t ? t.stage : null;
  if (!t) { t = stamp({ id: uid('ten') }, true); T.tenders.push(t); }
  ['title', 'issuer', 'sector', 'stage', 'portal', 'owner', 'published', 'clarificationDeadline', 'submissionDeadline', 'awardDate', 'contractStart', 'contractLength', 'incumbent', 'nextAction', 'notes'].forEach(function(k){ t[k] = (f[k] || '').trim(); });
  t.estValue = num(f.estValue); stamp(t);
  if (isNew) T.activities.push({ id: uid('act'), tenderId: t.id, type: 'Tender', note: 'Tender logged', at: nowISO(), by: S.user.name });
  else if (old !== t.stage) T.activities.push({ id: uid('act'), tenderId: t.id, type: 'Stage', note: 'Stage: ' + old + ' → ' + t.stage, at: nowISO(), by: S.user.name });
  save('tenders', S.user.name + ': tender ' + t.title); openTender(t.id); render();
}
function openTenderUpdate(id){
  var t = S.tenders.tenders.filter(function(x){ return x.id === id; })[0];
  openSheet('Update · ' + h(t.title), '<div class="field" style="margin-bottom:10px"><label>Type</label><div class="chips" id="atype">' + ['Note', 'Call', 'Email', 'Meeting', 'Submitted'].map(function(x, i){ return '<span class="chip ' + (i === 0 ? 'on' : '') + '" data-t="' + x + '" onclick="pickChip(this)">' + (ICONS[x] || '📄') + ' ' + x + '</span>'; }).join('') + '</div></div>' + fld('Notes', 'note', '', 'textarea') + '<div class="grid" style="margin-top:10px">' + fld('Next action', 'nextAction', t.nextAction, 'text', { span: true }) + fld('Stage', 'stage', t.stage, 'select', { options: S.cfg.tenderStages }) + '</div>',
    '<button class="btn" onclick="openTender(\'' + id + '\')">Cancel</button><button class="btn btn-gold" onclick="saveTenderUpdate(\'' + id + '\')">Save update</button>', { back: 'openTender(\'' + id + '\')' });
}
function saveTenderUpdate(id){
  var T = S.tenders, t = T.tenders.filter(function(x){ return x.id === id; })[0], f = readForm(), type = $('atype').querySelector('.chip.on').getAttribute('data-t');
  if (!f.note.trim() && f.stage === t.stage && f.nextAction === (t.nextAction || '')) { alert('Add a note or change something first.'); return; }
  var note = f.note.trim(); if (f.stage !== t.stage) note = (note ? note + '\n' : '') + 'Stage: ' + t.stage + ' → ' + f.stage;
  T.activities.push({ id: uid('act'), tenderId: id, type: type, note: note, at: nowISO(), by: S.user.name });
  t.stage = f.stage; t.nextAction = f.nextAction.trim(); stamp(t);
  save('tenders', S.user.name + ': update tender ' + t.title); openTender(id); render();
}
function deleteTender(id){ if (!confirm('Delete this tender?')) return; var T = S.tenders; T.tenders = T.tenders.filter(function(x){ return x.id !== id; }); T.activities = T.activities.filter(function(a){ return a.tenderId !== id; }); save('tenders', S.user.name + ': delete tender'); closeSheet(); render(); }

/* ---------- settings ---------- */
function openSettings(){
  var admin = canEdit('config');
  var body = '<div class="sec"><h3>Connection</h3><div class="b">' +
    '<div class="muted" style="margin-bottom:8px">Mode: <b>' + (S.mode === 'github' ? 'GitHub (shared)' : 'Local (this browser only)') + '</b>' + (S.mode === 'github' ? ' · ' + h(S.repo) + ' @ ' + h(S.branch) : '') + '</div>' +
    '<div class="grid">' + fld('Data repo (owner/repo)', 'repo', S.repo, 'text', { span: true }) + fld('Branch', 'branch', S.branch) + fld('GitHub token', 'token', S.token, 'password', { span: true, ph: 'github_pat_…' }) + '</div>' +
    '<div class="row" style="margin-top:10px"><button class="btn btn-gold" onclick="saveSettings()">Connect & reload</button><button class="btn" onclick="disconnect()">Use local mode</button>' + (S.token ? '<button class="btn" onclick="shareLink()">Copy share link</button>' : '') + '</div>' +
    '<div class="help" style="margin-top:10px">A share link is this page\'s address with the token after <code>#token=</code>. Open it once on a phone and the token is stored on that device (the link is then cleared from the address bar). Give reps a read/write token and viewers a read-only one.</div></div></div>';
  body += '<div class="sec"><h3>Data</h3><div class="b"><div class="row"><button class="btn" onclick="exportCSV()">Export opportunities CSV</button><button class="btn" onclick="exportJSON()">Backup JSON</button>' + (S.mode === 'local' ? '<button class="btn btn-red" onclick="resetLocal()">Reset local demo</button>' : '') + '</div></div></div>';
  if (admin) {
    body += '<div class="sec"><h3>PINs (admin)</h3><div class="b"><div class="grid">' + fld('User', 'pinUser', '', 'select', { options: S.cfg.users.map(function(u){ return [u.key, u.name + ' (' + u.role + ')']; }) }) + fld('New PIN (4–6 digits)', 'pinNew', '', 'text', { attrs: ' inputmode="numeric"' }) + '</div><div class="row" style="margin-top:10px"><button class="btn btn-gold" onclick="changePin()">Save PIN</button></div>' +
      '<div class="help" style="margin-top:10px">Users: ' + S.cfg.users.map(function(u){ return '<b>' + h(u.name) + '</b> edits ' + h((u.edits || []).join(', ') || 'nothing'); }).join(' · ') + '. To rename users or change stages/sectors, edit <code>' + h(DEFAULTS.CONFIG_PATH) + '</code> in the data repo.</div></div></div>';
  }
  body += '<div class="sec"><h3>Setup guide</h3><div class="b help"><ol>' +
    '<li>Create a <b>private</b> GitHub repo for the data (e.g. <code>crm-data</code>) and upload the <code>data/</code> folder (config, lindsay, di, tenders).</li>' +
    '<li>Put this <code>index.html</code> in a repo with GitHub Pages enabled (can be public — it holds no customer data).</li>' +
    '<li>GitHub → Settings → Developer settings → Fine-grained tokens → generate one scoped to <b>only the data repo</b> with <b>Contents: Read and write</b> (for reps) or <b>Read-only</b> (for viewers). Set the longest expiry.</li>' +
    '<li>Paste the token above (or open a share link) on each device. Change the default PINs straight away.</li></ol>' +
    '<div class="muted">Default PINs — Lindsay 1111 · Di 2222 · Sales Manager 3333 · Admin 9999</div></div></div>';
  openSheet('Settings', body, '<button class="btn" onclick="closeSheet()">Close</button>');
}
function saveSettings(){
  var f = readForm(); S.repo = f.repo.trim() || DEFAULTS.DATA_REPO; S.branch = f.branch.trim() || 'main'; S.token = f.token.trim();
  LS.set('repo', S.repo); LS.set('branch', S.branch); if (S.token) LS.set('token', S.token); else LS.del('token');
  S.mode = S.token ? 'github' : 'local'; S.shas = {}; S.missing = {}; S.data = {}; closeSheet();
  loadAll().then(function(){ render(); if (S.error) openSettings(); else toast(S.mode === 'github' ? 'Connected to ' + S.repo : 'Local mode'); });
}
function disconnect(){ S.token = ''; LS.del('token'); S.mode = 'local'; S.shas = {}; S.missing = {}; S.data = {}; closeSheet(); loadAll().then(render); }
function shareLink(){ var url = location.href.split('#')[0] + '#token=' + encodeURIComponent(S.token) + '&repo=' + encodeURIComponent(S.repo); copyText(url); }
function resetLocal(){ if (!confirm('Reset the local demo data back to the imported pipeline?')) return; ['file.' + DEFAULTS.CONFIG_PATH, 'file.' + DEFAULTS.TENDERS_PATH].forEach(LS.del); DEFAULT_CONFIG.users.forEach(function(u){ if (u.file) LS.del('file.' + u.file); }); S.data = {}; closeSheet(); loadAll().then(render); }
function changePin(){
  var f = readForm(); if (!/^\d{4,6}$/.test(f.pinNew)) { alert('PIN must be 4–6 digits'); return; }
  var u = userByKey(f.pinUser); var hsh = sha256(f.pinNew);
  if (S.cfg.users.some(function(x){ return x.pinHash === hsh && x !== u; })) { alert('Another user already has that PIN — choose a different one.'); return; }
  u.pinHash = hsh; save('config', 'Change PIN for ' + u.name).then(function(){ toast('PIN updated for ' + u.name); });
}
function seedRepo(){
  if (!confirm('Create the data files in ' + S.repo + ' now? Missing files are created from the imported pipeline (Lindsay) and empty templates.')) return;
  var jobs = [];
  if (S.missing[DEFAULTS.CONFIG_PATH]) jobs.push(function(){ return writeFile(DEFAULTS.CONFIG_PATH, S.cfg, 'Create config'); });
  repUsers().forEach(function(u){ if (S.missing[u.file]) jobs.push(function(){ if (SEED[u.key] && !S.data[u.key].opportunities.length) S.data[u.key] = JSON.parse(JSON.stringify(SEED[u.key])); return writeFile(u.file, S.data[u.key], 'Create ' + u.file); }); });
  if (S.missing[DEFAULTS.TENDERS_PATH]) jobs.push(function(){ return writeFile(DEFAULTS.TENDERS_PATH, S.tenders, 'Create tenders'); });
  setSync('busy', 'creating…');
  jobs.reduce(function(p, j){ return p.then(j); }, Promise.resolve()).then(function(){ S.missing = {}; setSync('ok', 'synced'); toast('Data files created'); render(); }).catch(function(e){ setSync('err', 'error'); alert('Could not create files: ' + e.message); });
}

/* ---------- export ---------- */
function exportCSV(){
  var cols = ['Owner', 'Company', 'Location', 'Sector', 'Type', 'Sage code', 'Staff', 'Main contact', 'Role', 'Phone', 'Email', 'Title', 'Stage', '% chance', '1st order value', 'Annual value', 'Weighted', 'Expected start', 'Next action', 'Due', 'Last activity', 'Created', 'Won on', 'Lost reason'];
  var rows = [cols];
  allOpps().forEach(function(x){ var o = x.o, a = x.acc, c = contactsOf(x.rep, a.id).filter(function(c){ return c.primary; })[0] || contactsOf(x.rep, a.id)[0] || {}; rows.push([x.rep.owner, a.name, a.location, a.sector, a.type, a.sageCode, a.staff, c.name, c.role, c.phone, c.email, o.title, o.stage, o.probability, o.firstOrderValue, o.annualValue, Math.round(weighted(o)), o.expectedStart, o.nextAction, o.nextActionDue, fmtDT(o.lastActivityAt), fmtDate(o.createdAt), o.wonDate, o.lostReason]); });
  var csv = rows.map(function(r){ return r.map(function(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
  download('pipeline-' + today() + '.csv', '﻿' + csv, 'text/csv');
}
function exportJSON(){ download('crm-backup-' + today() + '.json', JSON.stringify({ config: S.cfg, data: S.data, tenders: S.tenders }, null, 1), 'application/json'); }
function download(name, content, type){ var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type: type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ---------- boot ---------- */
function boot(){
  $('logo').src = TIBARD_LOGO;
  // token link: #token=...&repo=owner/repo
  if (location.hash && location.hash.indexOf('token=') >= 0) {
    var p = new URLSearchParams(location.hash.slice(1));
    if (p.get('token')) LS.set('token', p.get('token'));
    if (p.get('repo')) LS.set('repo', p.get('repo'));
    history.replaceState(null, '', location.pathname + location.search);
  }
  S.token = LS.get('token') || ''; S.repo = LS.get('repo') || DEFAULTS.DATA_REPO; S.branch = LS.get('branch') || DEFAULTS.BRANCH;
  S.mode = S.token ? 'github' : 'local';
  S.tab = LS.get('tab') || 'kpi';
  $('refreshBtn').onclick = function(){ S.data = {}; loadAll().then(render); };
  $('settingsBtn').onclick = openSettings;
  render();
  loadAll().then(function(){ restoreUser(); if (S.user && !userByKey(S.user.key)) S.user = null; render(); });
  setInterval(function(){ if (S.mode === 'github' && !document.hidden && !$('ovRoot').innerHTML) { S.data = {}; loadAll().then(render); } }, DEFAULTS.REFRESH_MS);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.mode === 'github' && !$('ovRoot').innerHTML) { S.data = {}; loadAll().then(render); } });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
}
boot();
</script>
</body>
